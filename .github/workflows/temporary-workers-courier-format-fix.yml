name: Temporary Workers Courier Format Fix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Normalize courier route method formatting
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: port/neoforge-1.21.1
          EXPECTED_SHA: 43e1fae29b42c128029a794090478c3d08049778
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/workers-courier-format"
          git clone --branch "$BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/nekomario28/workers.git" "$ROOT"
          cd "$ROOT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/talhanation/workers/client/gui/CourierScreen.java')
          s = p.read_text()
          old = '''private void loadAvailableRoutes() {
          availableRoutes.clear();
          ClientManager.loadRoutes();
          availableRoutes.addAll(ClientManager.getRoutesList());
          availableRoutes.sort((a, b) -> a.getName().compareToIgnoreCase(b.getName()));
          }
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = '''    private void loadAvailableRoutes() {
              availableRoutes.clear();
              ClientManager.loadRoutes();
              availableRoutes.addAll(ClientManager.getRoutesList());
              availableRoutes.sort((a, b) -> a.getName().compareToIgnoreCase(b.getName()));
          }
          '''
          new = '\n'.join(line[4:] if line.startswith('    ') else line for line in new.splitlines()) + '\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected one unformatted method, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/com/talhanation/workers/client/gui/CourierScreen.java
          git commit -m 'Format courier route loading method'
          git push origin "HEAD:$BRANCH"
