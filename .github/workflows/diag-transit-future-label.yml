name: Diagnostic Transit Future S12 Research-Only Station Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cross-check 2011-2015 positives against S12 operator station inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'requests==2.32.5' 'pyshp==2.3.1'
          mkdir -p input out
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/nekomario28/workers/actions/artifacts/9488546830/zip' \
            -o /tmp/v2.zip
          unzip -q /tmp/v2.zip -d input
          python3 - <<'PY'
          import csv, hashlib, io, json, requests, unicodedata, zipfile
          from collections import defaultdict, Counter
          from pathlib import Path
          import shapefile

          SRC=Path('input/transit_future_positive_labels_v2.csv')
          SRC_SHA='1beb73425ab6f1f89e4e7e02d962c20e4c7fdbc150fb0592d69d560b05eb3eab'
          if hashlib.sha256(SRC.read_bytes()).hexdigest()!=SRC_SHA: raise SystemExit('v2 SHA mismatch')
          rows=list(csv.DictReader(SRC.open(encoding='utf-8')))
          cohort=[r for r in rows if r['from_year']=='2011' and r['to_year']=='2015' and r['final_positive_v2']=='True']
          print('COHORT_POSITIVES',len(cohort))

          # S12-16 is research-only/non-commercial and is used ONLY as a source-quality audit.
          # It is not copied into the production label or feature set.
          urls=[
            'https://nlftp.mlit.go.jp/ksj/gml/data/S12/S12-16/S12-16_GML.zip',
            'https://nlftp.mlit.go.jp/ksj/gml/data/S12/S12-16/S12-16.zip',
          ]
          b=None; used_url=None
          for u in urls:
            r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=120)
            print('FETCH_TRY',u,r.status_code,len(r.content),r.content[:4])
            if r.status_code==200 and r.content[:2]==b'PK': b=r.content; used_url=u; break
          if b is None: raise SystemExit('S12-16 download failed')
          raw_sha=hashlib.sha256(b).hexdigest(); print('S12_RAW_SHA',raw_sha,used_url)
          z=zipfile.ZipFile(io.BytesIO(b)); names=z.namelist()
          shpfiles=sorted([n for n in names if n.lower().endswith('.shp')],key=lambda n:(0 if '/utf-8/' in n.lower() else 1,n))
          rdr=None; used=None
          for shp in shpfiles:
            base=shp[:-4]; need={e:next((n for n in names if n.lower()==(base+e).lower()),None) for e in ['.shp','.shx','.dbf']}
            if not all(need.values()): continue
            for enc in (['utf-8','cp932'] if '/utf-8/' in shp.lower() else ['cp932','utf-8']):
              try:
                x=shapefile.Reader(shp=io.BytesIO(z.read(need['.shp'])),shx=io.BytesIO(z.read(need['.shx'])),dbf=io.BytesIO(z.read(need['.dbf'])),encoding=enc)
                fields=[f[0] for f in x.fields[1:]]
                if all(k in fields for k in ['S12_001','S12_002','S12_003','S12_004']):
                  if len(x): _=x.record(0)
                  rdr=x; used=(shp,enc,fields); break
              except UnicodeDecodeError: pass
            if rdr is not None: break
          if rdr is None: raise SystemExit(f'S12 station shapefile not decoded: {shpfiles[:10]}')
          print('PARSE',used[0],used[1],len(rdr),used[2])

          def norm(x): return ''.join(unicodedata.normalize('NFKC',str(x or '')).split())
          byname=defaultdict(list)
          fields=used[2]
          for rec in rdr.iterRecords():
            d=dict(zip(fields,rec)); name=norm(d.get('S12_001'))
            if name: byname[name].append({'operator':norm(d.get('S12_002')),'line':norm(d.get('S12_003')),'type':str(d.get('S12_004','')).strip()})

          results=[]; counts=Counter()
          for c in cohort:
            pairs=[]
            for token in c['future_operator_lines'].split(';'):
              if '/' in token:
                op,line=token.split('/',1); pairs.append((norm(op),norm(line)))
            hits=byname.get(norm(c['future_station']),[])
            exact=[h for h in hits if any(h['operator']==op and h['line']==line for op,line in pairs)]
            linehits=[h for h in hits if any(h['line']==line for op,line in pairs)]
            status='exact_service' if exact else ('same_line' if linehits else ('name_only' if hits else 'absent'))
            counts[status]+=1
            results.append({'station':c['future_station'],'class':c['class'],'future_operator_lines':c['future_operator_lines'],'status':status,'matches':exact or linehits or hits})
          print('STATUS_COUNTS',json.dumps(dict(counts),ensure_ascii=False))
          print('NON_EXACT',json.dumps([x for x in results if x['status']!='exact_service'],ensure_ascii=False))
          summary={'purpose':'research-only source-quality audit; S12 must not enter commercial label/features',
                   'input_v2_sha256':SRC_SHA,'cohort':'2011->2015','cohort_positive_count':len(cohort),
                   's12_url':used_url,'s12_sha256':raw_sha,'parse_source':used[0],'encoding':used[1],
                   'status_counts':dict(counts),'results':results}
          p=Path('out/s12_2015_station_inventory_audit.json')
          p.write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('SUMMARY_SHA',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          sha256sum out/*
      - name: Upload S12 audit metadata only
        uses: actions/upload-artifact@v4
        with:
          name: transit-future-s12-audit-2015
          path: out/
          if-no-files-found: error
          retention-days: 1
