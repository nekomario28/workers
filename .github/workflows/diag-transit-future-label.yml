name: Diagnostic Transit Future Commercial N02 Positive Freeze

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate future station positives in to-year N02 snapshots
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'requests==2.32.5' 'pyshp==2.3.1'
          mkdir -p input out
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/nekomario28/workers/actions/artifacts/9481895787/zip' \
            -o /tmp/v4.zip
          unzip -q /tmp/v4.zip -d input
          python3 - <<'PY'
          import csv, hashlib, io, json, math, requests, unicodedata, zipfile
          from collections import Counter, defaultdict
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import shapefile

          SRC=Path('input/n02_historical_service_identity_v4.csv')
          SRC_SHA='6569b697b698a738eab867967e014ec7754ffff0cf4241f75d6f4341c21559db'
          if hashlib.sha256(SRC.read_bytes()).hexdigest()!=SRC_SHA:
            raise SystemExit('v4 input SHA mismatch')
          rows=list(csv.DictReader(SRC.open(encoding='utf-8')))
          if len(rows)!=195: raise SystemExit(f'expected 195 rows, got {len(rows)}')

          def norm(x): return ''.join(unicodedata.normalize('NFKC',str(x or '')).split())
          def hav(a,b):
            lat1,lon1=a; lat2,lon2=b; R=6371000.0
            p1=math.radians(lat1); p2=math.radians(lat2)
            dp=math.radians(lat2-lat1); dl=math.radians(lon2-lon1)
            q=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
            return 2*R*math.asin(min(1,math.sqrt(q)))
          def center(points):
            if not points: return None
            xs=[p[0] for p in points]; ys=[p[1] for p in points]
            return ((min(ys)+max(ys))/2,(min(xs)+max(xs))/2)
          def urls_for(y):
            yy=y%100
            return [f'https://nlftp.mlit.go.jp/ksj/gml/data/N02/N02-{yy:02d}/N02-{yy:02d}_GML.zip',
                    f'https://nlftp.mlit.go.jp/ksj/gml/data/N02/N02-{yy:02d}/N02-{yy:02d}.zip']
          def fetch(y):
            last=None
            for u in urls_for(y):
              try:
                r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=120)
                if r.status_code==200 and r.content[:2]==b'PK': return y,u,r.content
                last=f'{r.status_code} {r.content[:16]!r}'
              except Exception as e: last=repr(e)
            raise RuntimeError(f'{y}: {last}')
          def parse_station_zip(y,b):
            z=zipfile.ZipFile(io.BytesIO(b)); names=z.namelist()
            station_files=sorted([n for n in names if n.lower().endswith('station.shp')],key=lambda n:(0 if '/UTF-8/' in n else 1,n))
            if not station_files: station_files=sorted([n for n in names if 'station' in n.lower() and n.lower().endswith('.shp')])
            rdr=None; used=None
            for shp in station_files:
              base=shp[:-4]
              need={e:next((n for n in names if n.lower()==(base+e).lower()),None) for e in ['.shp','.shx','.dbf']}
              if not all(need.values()): continue
              for enc in (['utf-8','cp932'] if '/UTF-8/' in shp else ['cp932','utf-8']):
                try:
                  x=shapefile.Reader(shp=io.BytesIO(z.read(need['.shp'])),shx=io.BytesIO(z.read(need['.shx'])),dbf=io.BytesIO(z.read(need['.dbf'])),encoding=enc)
                  if len(x): _=x.record(0)
                  rdr=x; used=(shp,enc); break
                except UnicodeDecodeError: pass
              if rdr is not None: break
            if rdr is None: raise SystemExit(f'{y}: station decode failure')
            fields=[f[0] for f in rdr.fields[1:]]
            for need in ['N02_001','N02_003','N02_004','N02_005']:
              if need not in fields: raise SystemExit(f'{y}: missing {need}; fields={fields}')
            byname=defaultdict(list)
            for sr in rdr.iterShapeRecords():
              d=dict(zip(fields,sr.record)); pt=center(sr.shape.points)
              if pt is None: continue
              name=norm(d.get('N02_005'))
              if not name: continue
              byname[name].append({'pt':pt,'type':str(d.get('N02_001','')).strip(),
                                   'line':norm(d.get('N02_003')),'op':norm(d.get('N02_004')),
                                   'raw_name':str(d.get('N02_005',''))})
            return byname, {'rows':sum(len(v) for v in byname.values()),'source':used[0],'encoding':used[1]}

          years=sorted({int(r['to_year']) for r in rows})
          blobs={}; urls={}; raw_sha={}
          with ThreadPoolExecutor(max_workers=3) as ex:
            futs={ex.submit(fetch,y):y for y in years}
            for fut in as_completed(futs):
              y,u,b=fut.result(); blobs[y]=b; urls[y]=u; raw_sha[y]=hashlib.sha256(b).hexdigest()
              print('FETCH',y,len(b),raw_sha[y],u)
          if set(blobs)!=set(years): raise SystemExit('to-year coverage incomplete')
          snapshots={}; parse_meta={}
          for y in years:
            snapshots[y],parse_meta[y]=parse_station_zip(y,blobs[y]); print('PARSE',y,parse_meta[y])

          allowed_types={'11','12','13','14','15','16','21','22','23','24','25'}
          out=[]; reason=Counter(); class_keep=Counter(); missing=[]
          for r in rows:
            cls=r['class']; near300=(r['near_prior_station_300m']=='True')
            base_keep=(cls in ('new_line_candidate','extension_candidate')) or (cls=='existing_line_infill_candidate' and not near300)
            prior_clean=(r['n02_prior_service_diag']=='no_prior_same_service')
            pairs=[]
            for token in r['future_operator_lines'].split(';'):
              if '/' in token:
                op,line=token.split('/',1); pairs.append((norm(op),norm(line)))
            pt=(float(r['lat']),float(r['lon'])); matches=[]
            for cand in snapshots[int(r['to_year'])].get(norm(r['future_station']),[]):
              pair_match=any(cand['op']==op and cand['line']==line for op,line in pairs)
              line_match=any(cand['line']==line for op,line in pairs)
              if pair_match or line_match:
                matches.append({**cand,'distance_m':round(hav(pt,cand['pt']),2),'pair_match':pair_match,'line_match':line_match})
            exact=[m for m in matches if m['pair_match']]
            use=exact or matches
            types=sorted({m['type'] for m in use})
            min_dist=min((m['distance_m'] for m in use),default=None)
            present=bool(use) and min_dist is not None and min_dist<=1000
            railtype=present and any(t in allowed_types for t in types)
            high=base_keep and prior_clean and present and railtype
            if not base_keep: why='topology_reject'
            elif not prior_clean: why='prior_same_service'
            elif not present: why='missing_from_to_year_n02'
            elif not railtype: why='non_rail_type'
            else: why='high_precision_positive'
            reason[why]+=1
            if high: class_keep[cls]+=1
            if base_keep and prior_clean and not high:
              missing.append({'from_year':r['from_year'],'to_year':r['to_year'],'station':r['future_station'],'class':cls,'reason':why,'types':types,'min_distance_m':min_dist,'future_operator_lines':r['future_operator_lines']})
            out.append({**r,'to_year_n02_present':present,'to_year_n02_types':';'.join(types),
                        'to_year_n02_min_distance_m':'' if min_dist is None else min_dist,
                        'high_precision_positive':high,'positive_reason':why})

          fields=list(rows[0].keys())+['to_year_n02_present','to_year_n02_types','to_year_n02_min_distance_m','high_precision_positive','positive_reason']
          p=Path('out/transit_future_positive_labels_v1.csv')
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(out)
          summary={'input_v4_sha256':SRC_SHA,'to_years':years,'snapshot_urls':urls,'snapshot_sha256':raw_sha,
                   'parse_meta':parse_meta,'reason_counts':dict(reason),'high_precision_by_class':dict(class_keep),
                   'rejected_after_base_clean':missing,'csv_sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          Path('out/transit_future_positive_labels_v1_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('REASON_COUNTS',json.dumps(dict(reason),ensure_ascii=False))
          print('HIGH_PRECISION_BY_CLASS',json.dumps(dict(class_keep),ensure_ascii=False))
          print('REJECTED_AFTER_BASE_CLEAN',json.dumps(missing,ensure_ascii=False))
          print('CSV_SHA',summary['csv_sha256'])
          if len(out)!=195: raise SystemExit('row coverage failure')
          PY
          sha256sum out/*
      - name: Upload commercial-safe positive freeze
        uses: actions/upload-artifact@v4
        with:
          name: transit-future-positive-labels-v1
          path: out/
          if-no-files-found: error
          retention-days: 1
