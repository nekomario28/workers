name: Diagnostic Transit Future Label

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover N02 annual snapshot downloads and inspect station schema
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'requests==2.32.5' 'pyshp==2.3.1'
          mkdir -p out
          python3 - <<'PY'
          import hashlib, io, json, re, requests, zipfile
          from pathlib import Path
          import shapefile

          years=[2011,2015,2020,2025]
          yy={2011:'11',2015:'15',2020:'20',2025:'25'}
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0'})
          index='https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-N02-2025.html'
          ir=s.get(index,timeout=30); ir.raise_for_status(); html=ir.text
          Path('out/index.html').write_text(html,encoding='utf-8')
          summary=[]
          for year in years:
            code=yy[year]; fname=f'N02-{code}_GML.zip'
            pos=html.find(fname)
            print('INDEX',year,'FNAME_POS',pos)
            if pos<0: raise SystemExit(f'{fname} not listed in canonical index')
            candidates=[]
            # Extract the canonical onclick relative path from the index when present.
            for m in re.finditer(r"DownLd\([^)]*'([^']*%s)'" % re.escape(fname), html):
              candidates.append(requests.compat.urljoin(index,m.group(1)))
            candidates += [f'https://nlftp.mlit.go.jp/ksj/gml/data/N02/N02-{code}/{fname}']
            seen=[]
            for u in candidates:
              if u not in seen: seen.append(u)
            chosen=None; blob=None
            for u in seen:
              try:
                rr=s.get(u,timeout=60,allow_redirects=True)
                print('PROBE',year,rr.status_code,len(rr.content),rr.url,u)
                if rr.status_code==200 and rr.content[:2]==b'PK': chosen=rr.url; blob=rr.content; break
              except Exception as e: print('PROBE_ERR',year,u,repr(e))
            if blob is None: raise SystemExit(f'no downloadable N02 zip resolved for {year}')
            zsha=hashlib.sha256(blob).hexdigest(); Path(f'out/N02-{code}.zip').write_bytes(blob)
            z=zipfile.ZipFile(io.BytesIO(blob)); names=z.namelist()
            print('ZIP',year,zsha,len(names),names[:40])
            shp=[n for n in names if n.lower().endswith('.shp') and 'station' in n.lower()]
            station_count=None; fields=[]; samples=[]; station_file=None; encoding_used=None
            for candidate in shp:
              base=candidate[:-4]
              need={ext:next((n for n in names if n.lower()==(base+ext).lower()),None) for ext in ['.shp','.shx','.dbf']}
              if not all(need.values()): continue
              last_err=None
              for enc in (['cp932','shift_jis','utf-8'] if year<=2015 else ['utf-8','cp932']):
                try:
                  rdr=shapefile.Reader(shp=io.BytesIO(z.read(need['.shp'])),shx=io.BytesIO(z.read(need['.shx'])),dbf=io.BytesIO(z.read(need['.dbf'])),encoding=enc)
                  flds=[f[0] for f in rdr.fields[1:]]
                  if not any(x in flds for x in ['N02_005','N02_005c','N02_005g']): break
                  sm=[]
                  for idx,sr in enumerate(rdr.iterShapeRecords()):
                    if idx<5: sm.append(dict(zip(flds,sr.record)))
                  fields=flds; station_count=len(rdr); samples=sm; station_file=candidate; encoding_used=enc
                  break
                except UnicodeDecodeError as e: last_err=e; continue
              if station_count is not None: break
              if last_err: print('ENCODING_FAIL',year,candidate,repr(last_err))
            print('STATIONS',year,station_count,'SHP',station_file,'ENC',encoding_used,'FIELDS',fields,'SAMPLES',json.dumps(samples,ensure_ascii=False)[:10000])
            summary.append({'year':year,'url':chosen,'zip_sha256':zsha,'station_shp':station_file,'station_count':station_count,'encoding':encoding_used,'fields':fields,'samples':samples})
          assert all(x['station_count'] for x in summary), summary
          Path('out/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          sha256sum out/* || true
      - name: Upload transit label discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: transit-future-label-discovery
          path: out/
          if-no-files-found: error
          retention-days: 1
