name: Diagnostic Transit Future N05 Spatial Relation Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Audit exact topology-v2 artifact against spatially local N05 history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'requests==2.32.5' 'pyshp==2.3.1'
          mkdir -p input out
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/nekomario28/workers/actions/artifacts/9481427242/zip' \
            -o /tmp/topology-v2.zip
          unzip -q /tmp/topology-v2.zip -d input
          python3 - <<'PY'
          import csv, hashlib, io, json, math, re, requests, unicodedata, zipfile
          from collections import defaultdict, Counter
          from pathlib import Path
          import shapefile

          CANONICAL_SHA='1202090e0959a8460a2babc4593672b8474e24040ff70ea136662b26bf83c2d6'
          LOCAL_HISTORY_M=500.0
          p=Path('input/topology_labels_v2.csv'); cb=p.read_bytes(); csha=hashlib.sha256(cb).hexdigest()
          print('CANDIDATE_SHA',csha)
          if csha!=CANONICAL_SHA: raise SystemExit(f'canonical artifact mismatch {csha}')
          candidates=list(csv.DictReader(io.StringIO(cb.decode('utf-8'))))
          if len(candidates)!=195: raise SystemExit(f'expected 195 candidates, got {len(candidates)}')
          Path('out/topology_labels_v2.csv').write_bytes(cb)

          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0'})
          def norm(x): return ''.join(unicodedata.normalize('NFKC',str(x or '')).split())
          def hav(a,b):
            lat1,lon1=a; lat2,lon2=b; R=6371000.0
            p1=math.radians(lat1); p2=math.radians(lat2); dp=math.radians(lat2-lat1); dl=math.radians(lon2-lon1)
            q=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
            return 2*R*math.asin(min(1,math.sqrt(q)))
          def year(v):
            m=re.search(r'(19\d{2}|20\d{2}|9999|999)',str(v or ''))
            return int(m.group(1)) if m else None

          url='https://nlftp.mlit.go.jp/ksj/gml/data/N05/N05-25/N05-25_GML.zip'
          for attempt in range(4):
            try:
              rr=s.get(url,timeout=120); rr.raise_for_status(); blob=rr.content
              if blob[:2]!=b'PK': raise RuntimeError('not ZIP')
              break
            except Exception as e:
              print('N05_FETCH_RETRY',attempt+1,repr(e))
              if attempt==3: raise
          n05sha=hashlib.sha256(blob).hexdigest(); z=zipfile.ZipFile(io.BytesIO(blob)); names=z.namelist()
          station_files=sorted([n for n in names if n.lower().endswith('station2.shp')],key=lambda n:(0 if '/UTF-8/' in n else 1,n))
          rdr=None; used=None
          for shpname in station_files:
            base=shpname[:-4]; need={e:next((n for n in names if n.lower()==(base+e).lower()),None) for e in ['.shp','.shx','.dbf']}
            if not all(need.values()): continue
            for enc in (['utf-8','cp932'] if '/UTF-8/' in shpname else ['cp932','utf-8']):
              try:
                x=shapefile.Reader(shp=io.BytesIO(z.read(need['.shp'])),shx=io.BytesIO(z.read(need['.shx'])),dbf=io.BytesIO(z.read(need['.dbf'])),encoding=enc)
                if len(x): _=x.record(0)
                rdr=x; used=(shpname,enc); break
              except UnicodeDecodeError: continue
            if rdr is not None: break
          if rdr is None: raise SystemExit('cannot decode N05 Station2')
          fields=[f[0] for f in rdr.fields[1:]]
          required={'N05_002','N05_003','N05_005b','N05_005e','N05_006','N05_011'}
          if not required.issubset(fields): raise SystemExit('missing N05 fields '+repr(sorted(required-set(fields))))
          records=[]; byrel=defaultdict(list); byname=defaultdict(list)
          for idx,sr in enumerate(rdr.iterShapeRecords()):
            d=dict(zip(fields,sr.record)); pts=sr.shape.points
            if not pts: continue
            rec={'idx':idx,'name':str(d.get('N05_011','')),'name_n':norm(d.get('N05_011')),'line':str(d.get('N05_002','')),'op':str(d.get('N05_003','')),
                 'start':year(d.get('N05_005b')),'end':year(d.get('N05_005e')),'rel':str(d.get('N05_006','')),'pt':(pts[0][1],pts[0][0])}
            records.append(rec); byrel[rec['rel']].append(rec); byname[rec['name_n']].append(rec)
          print('N05',n05sha,'SOURCE',used,'ROWS',len(records),'RELATIONS',len(byrel))

          out=[]; class_counts=defaultdict(Counter); match_counts=Counter()
          for c in candidates:
            fy=int(c['from_year']); ty=int(c['to_year']); pt=(float(c['lat']),float(c['lon'])); nn=norm(c['future_station'])
            same=[]
            for r in byname.get(nn,[]):
              d=hav(pt,r['pt'])
              if d<=500: same.append((d,r))
            matched=same; mode='same_name_500m'
            if not matched:
              near=[]
              for r in records:
                if abs(r['pt'][0]-pt[0])>0.002 or abs(r['pt'][1]-pt[1])>0.003: continue
                d=hav(pt,r['pt'])
                if d<=100: near.append((d,r))
              matched=near; mode='geometry_100m_fallback'
            if matched:
              match_counts[mode]+=1; mind=min(d for d,r in matched)
              rels=sorted(set(r['rel'] for d,r in matched if d<=mind+30.0))
              local_hist=[]; global_hist=[]
              for rel in rels:
                global_hist.extend(byrel[rel])
                local_hist.extend(r for r in byrel[rel] if hav(pt,r['pt'])<=LOCAL_HISTORY_M)
              local_starts=[r['start'] for r in local_hist if r['start'] not in (None,999,9999)]
              global_starts=[r['start'] for r in global_hist if r['start'] not in (None,999,9999)]
              any_pre=any(v<=fy for v in local_starts); any_new=any(fy<v<=ty for v in local_starts)
              if any_pre and any_new: audit='local_mixed_old_and_new_relations'
              elif any_pre: audit='local_preexisting_relation'
              elif any_new: audit='local_new_relation_in_interval'
              elif local_starts and all(v>ty for v in local_starts): audit='local_relation_starts_after_target'
              else: audit='local_relation_start_unknown'
              local_first=min(local_starts) if local_starts else None; global_first=min(global_starts) if global_starts else None
              local_names=sorted(set(r['name'] for r in local_hist)); global_names=sorted(set(r['name'] for r in global_hist))
              local_lines=sorted(set(r['line'] for r in local_hist)); local_ops=sorted(set(r['op'] for r in local_hist))
              nearest=round(mind,2)
            else:
              match_counts['none']+=1; rels=[]; audit='no_n05_match'; local_first=global_first=None; local_names=[]; global_names=[]; local_lines=[]; local_ops=[]; nearest=None; mode='none'
            class_counts[c['class']][audit]+=1
            out.append({**c,'n05_match_mode':mode,'n05_nearest_m':nearest,'n05_relation_ids':';'.join(rels),'n05_global_first_start':global_first,
                        'n05_local_first_start':local_first,'n05_spatial_audit':audit,'n05_local_history_names':' | '.join(local_names),
                        'n05_global_history_names':' | '.join(global_names),'n05_local_history_lines':' | '.join(local_lines),'n05_local_history_operators':' | '.join(local_ops)})
          cols=list(candidates[0].keys())+['n05_match_mode','n05_nearest_m','n05_relation_ids','n05_global_first_start','n05_local_first_start','n05_spatial_audit','n05_local_history_names','n05_global_history_names','n05_local_history_lines','n05_local_history_operators']
          with open('out/n05_spatial_relation_audit.csv','w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=cols); w.writeheader(); w.writerows(out)
          lookup={(r['from_year'],r['to_year'],r['future_station']):r for r in out}
          checks={k:lookup.get(key,{}).get('n05_spatial_audit') for k,key in {
            '大阪梅田':('2015','2020','大阪梅田'),'羽田空港第3ターミナル':('2015','2020','羽田空港第3ターミナル'),
            '高輪ゲートウェイ':('2015','2020','高輪ゲートウェイ'),'梅小路京都西':('2015','2020','梅小路京都西'),'新綱島':('2020','2025','新綱島')}.items()}
          summary={'canonical_topology_v2_sha256':CANONICAL_SHA,'n05_raw_sha256':n05sha,'local_history_m':LOCAL_HISTORY_M,'candidate_rows':len(candidates),
                   'match_counts':dict(match_counts),'class_audit_counts':{k:dict(v) for k,v in class_counts.items()},'sanity':checks}
          Path('out/n05_spatial_relation_audit_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('CLASS_AUDIT',json.dumps(summary['class_audit_counts'],ensure_ascii=False)); print('SANITY',json.dumps(checks,ensure_ascii=False)); print('SUMMARY',json.dumps(summary,ensure_ascii=False))
          expected={'大阪梅田':'local_preexisting_relation','羽田空港第3ターミナル':'local_preexisting_relation','高輪ゲートウェイ':'local_new_relation_in_interval','梅小路京都西':'local_new_relation_in_interval','新綱島':'local_new_relation_in_interval'}
          bad={k:(checks.get(k),v) for k,v in expected.items() if checks.get(k)!=v}
          if bad: raise SystemExit('N05_SPATIAL_SANITY_FAIL '+json.dumps(bad,ensure_ascii=False))
          PY
          sha256sum out/*
      - name: Upload N05 spatial relation audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transit-future-n05-spatial-relation-audit
          path: out/
          if-no-files-found: warn
          retention-days: 1
