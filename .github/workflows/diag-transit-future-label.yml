name: Diagnostic Transit Future 2020 Gap Label Censoring

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Freeze positive-negative-censored labels using 2025 service survival
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'requests==2.32.5' 'pyshp==2.3.1'
          mkdir -p input out
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/nekomario28/workers/actions/artifacts/9488710884/zip' -o /tmp/gaps.zip
          unzip -q /tmp/gaps.zip -d input
          python3 - <<'PY'
          import csv, hashlib, io, json, requests, unicodedata, zipfile
          from collections import Counter, defaultdict
          from pathlib import Path
          import shapefile

          GAP=Path('input/transit_future_gap_universe_2020.csv')
          GAP_SHA='ea93ba5cb68c44b1b524059da098d1a8e110fa58aa93f6d502422ad34833ab1c'
          if hashlib.sha256(GAP.read_bytes()).hexdigest()!=GAP_SHA: raise SystemExit('gap universe SHA mismatch')
          rows=list(csv.DictReader(GAP.open(encoding='utf-8')))
          if len(rows)!=9677: raise SystemExit(f'expected 9677 gaps, got {len(rows)}')
          def norm(x): return ''.join(unicodedata.normalize('NFKC',str(x or '')).split())

          urls=['https://nlftp.mlit.go.jp/ksj/gml/data/N02/N02-25/N02-25_GML.zip','https://nlftp.mlit.go.jp/ksj/gml/data/N02/N02-25/N02-25.zip']
          raw=None; used=None
          for u in urls:
            r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=120)
            if r.status_code==200 and r.content[:2]==b'PK': raw=r.content; used=u; break
          if raw is None: raise SystemExit('2025 N02 download failed')
          z=zipfile.ZipFile(io.BytesIO(raw)); names=z.namelist()
          shpfiles=sorted([n for n in names if n.lower().endswith('station.shp')],key=lambda n:(0 if '/utf-8/' in n.lower() else 1,n))
          rdr=None; meta=None
          for shp in shpfiles:
            base=shp[:-4]; need={e:next((n for n in names if n.lower()==(base+e).lower()),None) for e in ['.shp','.shx','.dbf']}
            if not all(need.values()): continue
            for enc in (['utf-8','cp932'] if '/utf-8/' in shp.lower() else ['cp932','utf-8']):
              try:
                x=shapefile.Reader(shp=io.BytesIO(z.read(need['.shp'])),shx=io.BytesIO(z.read(need['.shx'])),dbf=io.BytesIO(z.read(need['.dbf'])),encoding=enc)
                fields=[f[0] for f in x.fields[1:]]
                if all(k in fields for k in ['N02_003','N02_004','N02_005']):
                  if len(x): _=x.record(0)
                  rdr=x; meta=(shp,enc,fields); break
              except UnicodeDecodeError: pass
            if rdr is not None: break
          if rdr is None: raise SystemExit('2025 Station shapefile decode failure')
          fields=meta[2]; future=defaultdict(set)
          for rec in rdr.iterRecords():
            d=dict(zip(fields,rec)); op=norm(d.get('N02_004')); line=norm(d.get('N02_003')); name=norm(d.get('N02_005'))
            if op and line and name: future[(op,line)].add(name)
          print('N02_2025',used,'SHA',hashlib.sha256(raw).hexdigest(),'station_records',len(rdr),'groups',len(future),'source',meta[0],'encoding',meta[1])

          counts=Counter(); out=[]
          for r in rows:
            group=(norm(r['operator']),norm(r['line'])); names25=future.get(group,set())
            a=norm(r['station_a']); b=norm(r['station_b'])
            a_surv=a in names25; b_surv=b in names25
            special=r['official_brt_special_mode_excluded']=='True'; pos=r['positive_infill_2020_2025']=='True'
            if special: status='special_mode_excluded'
            elif pos: status='positive'
            elif a_surv and b_surv: status='negative'
            else: status='censored_service_or_endpoint_change'
            counts[status]+=1
            out.append({**r,'station_a_survives_same_service_2025':a_surv,'station_b_survives_same_service_2025':b_surv,'label_status_v1':status})
          if counts['positive']!=17: raise SystemExit('positive count changed during censoring')

          labeled=[r for r in out if r['label_status_v1'] in {'positive','negative'}]
          ranked=sorted(labeled,key=lambda r:(-float(r['gap_length_m']),r['operator'],r['line'],r['station_a'],r['station_b']))
          P=counts['positive']; N=len(ranked); hits=0; ap=0.; ranks=[]
          for rank,r in enumerate(ranked,1):
            if r['label_status_v1']=='positive': hits+=1; ap+=hits/rank; ranks.append(rank)
          ap/=P
          def top(k):
            k=min(k,N); h=sum(r['label_status_v1']=='positive' for r in ranked[:k]); return {'k':k,'hits':h,'precision':h/k if k else 0.,'recall':h/P}
          p=Path('out/transit_future_gap_labels_2020_2025_v1.csv'); fields=list(out[0].keys())
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(out)
          summary={'input_gap_sha256':GAP_SHA,'n02_2025_url':used,'n02_2025_zip_sha256':hashlib.sha256(raw).hexdigest(),
                   'n02_2025_station_source':meta[0],'n02_2025_station_encoding':meta[1],'status_counts':dict(counts),
                   'labeled_count':N,'positive_count':P,'prevalence':P/N,'gap_length_average_precision':ap,
                   'topk':[top(17),top(50),top(100),top(max(1,round(N*.01))),top(max(1,round(N*.05)))],
                   'csv_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                   'negative_definition':'same operator/line and both cutoff endpoint station names survive in 2025, no clean infill positive observed; other service/endpoint changes censored'}
          q=Path('out/transit_future_gap_labels_2020_2025_v1_summary.json'); q.write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('STATUS',json.dumps(dict(counts),ensure_ascii=False))
          print('LABELED',N,'prevalence',P/N,'length_AP',ap)
          print('TOPK',json.dumps(summary['topk'],ensure_ascii=False))
          print('CSV_SHA',summary['csv_sha256'])
          print('SUMMARY_SHA',hashlib.sha256(q.read_bytes()).hexdigest())
          PY
          sha256sum out/*
      - name: Upload censored label freeze
        uses: actions/upload-artifact@v4
        with:
          name: transit-future-gap-labels-2020-2025-v1
          path: out/
          if-no-files-found: error
          retention-days: 1
