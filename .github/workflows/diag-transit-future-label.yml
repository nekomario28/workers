name: Diagnostic Transit Future N02 Historical Service Identity

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check same-name same-service history before cutoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'requests==2.32.5' 'beautifulsoup4==4.13.4' 'pyshp==2.3.1'
          mkdir -p input out
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/nekomario28/workers/actions/artifacts/9481427242/zip' \
            -o /tmp/topology-v2.zip
          unzip -q /tmp/topology-v2.zip -d input
          python3 - <<'PY'
          import csv, hashlib, io, json, math, re, requests, unicodedata, zipfile
          from collections import defaultdict, Counter
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import shapefile

          CANONICAL_SHA='1202090e0959a8460a2babc4593672b8474e24040ff70ea136662b26bf83c2d6'
          YEARS=[2005,2006,2007,2008]+list(range(2011,2021))
          cb=Path('input/topology_labels_v2.csv').read_bytes(); csha=hashlib.sha256(cb).hexdigest()
          if csha!=CANONICAL_SHA: raise SystemExit(f'canonical artifact mismatch {csha}')
          candidates=list(csv.DictReader(io.StringIO(cb.decode('utf-8'))))
          if len(candidates)!=195: raise SystemExit(f'expected 195 candidates, got {len(candidates)}')
          Path('out/topology_labels_v2.csv').write_bytes(cb)

          def norm(x): return ''.join(unicodedata.normalize('NFKC',str(x or '')).split())
          def hav(a,b):
            lat1,lon1=a; lat2,lon2=b; R=6371000.0
            p1=math.radians(lat1); p2=math.radians(lat2); dp=math.radians(lat2-lat1); dl=math.radians(lon2-lon1)
            q=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
            return 2*R*math.asin(min(1,math.sqrt(q)))
          def center(points):
            xs=[p[0] for p in points]; ys=[p[1] for p in points]
            return ((min(ys)+max(ys))/2,(min(xs)+max(xs))/2) if points else None
          def urls_for(y):
            yy=y%100
            x=[f'https://nlftp.mlit.go.jp/ksj/gml/data/N02/N02-{yy:02d}/N02-{yy:02d}_GML.zip']
            if y==2013: x.insert(0,f'https://nlftp.mlit.go.jp/ksj/gml/data/N02/N02-{yy:02d}/N02-{yy:02d}.zip')
            return x
          def fetch(y):
            last=None
            for u in urls_for(y):
              try:
                r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=120)
                if r.status_code==200 and r.content[:2]==b'PK': return y,u,r.content
                last=f'{r.status_code} {r.content[:16]!r}'
              except Exception as e: last=repr(e)
            raise RuntimeError(f'{y} {last}')

          blobs={}; shas={}; urls={}
          with ThreadPoolExecutor(max_workers=4) as ex:
            futs={ex.submit(fetch,y):y for y in YEARS}
            for fut in as_completed(futs):
              y,u,b=fut.result(); blobs[y]=b; urls[y]=u; shas[y]=hashlib.sha256(b).hexdigest(); print('FETCH',y,len(b),shas[y])
          if set(blobs)!=set(YEARS): raise SystemExit('snapshot coverage incomplete')

          hist={}; parse={}
          for y in YEARS:
            z=zipfile.ZipFile(io.BytesIO(blobs[y])); names=z.namelist()
            station_files=sorted([n for n in names if n.lower().endswith('station.shp')],key=lambda n:(0 if '/UTF-8/' in n else 1,n))
            if not station_files: station_files=sorted([n for n in names if 'station' in n.lower() and n.lower().endswith('.shp')])
            rdr=None; used=None
            for shp in station_files:
              base=shp[:-4]; need={e:next((n for n in names if n.lower()==(base+e).lower()),None) for e in ['.shp','.shx','.dbf']}
              if not all(need.values()): continue
              for enc in (['utf-8','cp932'] if '/UTF-8/' in shp else ['cp932','utf-8']):
                try:
                  x=shapefile.Reader(shp=io.BytesIO(z.read(need['.shp'])),shx=io.BytesIO(z.read(need['.shx'])),dbf=io.BytesIO(z.read(need['.dbf'])),encoding=enc)
                  if len(x): _=x.record(0)
                  rdr=x; used=(shp,enc); break
                except UnicodeDecodeError: pass
              if rdr is not None: break
            if rdr is None: raise SystemExit(f'decode failure {y}')
            fields=[f[0] for f in rdr.fields[1:]]
            for need in ['N02_003','N02_004','N02_005']:
              if need not in fields: raise SystemExit(f'{y} missing {need}')
            byname=defaultdict(list); n=0
            for sr in rdr.iterShapeRecords():
              d=dict(zip(fields,sr.record)); pt=center(sr.shape.points)
              if pt is None: continue
              nn=norm(d.get('N02_005')); line=norm(d.get('N02_003')); op=norm(d.get('N02_004'))
              if nn: byname[nn].append({'pt':pt,'line':line,'op':op,'name':str(d.get('N02_005',''))}); n+=1
            hist[y]=byname; parse[y]={'rows':n,'source':used[0],'encoding':used[1]}; print('PARSE',y,n,used)

          out=[]; diag_counts=Counter(); kept_hits=[]
          for c in candidates:
            fy=int(c['from_year']); nn=norm(c['future_station']); pt=(float(c['lat']),float(c['lon']))
            pairs=[]
            for token in c['future_operator_lines'].split(';'):
              if '/' in token:
                op,line=token.split('/',1); pairs.append((norm(op),norm(line)))
            matches=[]
            for y in YEARS:
              if y>fy: continue
              for r in hist[y].get(nn,[]):
                same_line=any(r['line']==line for op,line in pairs if line)
                same_op=any(r['op']==op for op,line in pairs if op)
                same_pair=any(r['op']==op and r['line']==line for op,line in pairs if op and line)
                if same_line or same_pair:
                  matches.append({'year':y,'distance_m':round(hav(pt,r['pt']),2),'same_line':same_line,'same_operator':same_op,'same_pair':same_pair,'line':r['line'],'operator':r['op']})
            exact_pair=[m for m in matches if m['same_pair']]
            same_line=[m for m in matches if m['same_line']]
            diag='no_prior_same_service'
            if exact_pair: diag='prior_same_name_same_operator_line'
            elif same_line: diag='prior_same_name_same_line'
            diag_counts[diag]+=1

            cls=c['class']; near300=(c['near_prior_station_300m']=='True')
            base_keep=(cls in ('new_line_candidate','extension_candidate')) or (cls=='existing_line_infill_candidate' and not near300)
            if base_keep and diag!='no_prior_same_service':
              kept_hits.append({'from_year':c['from_year'],'to_year':c['to_year'],'station':c['future_station'],'class':cls,'diag':diag,
                                'min_distance_m':min(m['distance_m'] for m in (exact_pair or same_line)),
                                'years':sorted(set(m['year'] for m in (exact_pair or same_line))),
                                'future_operator_lines':c['future_operator_lines']})
            out.append({**c,'n02_prior_service_diag':diag,
                        'n02_prior_service_years':';'.join(str(y) for y in sorted(set(m['year'] for m in (exact_pair or same_line)))),
                        'n02_prior_service_min_distance_m':min((m['distance_m'] for m in (exact_pair or same_line)),default='')})

          outp=Path('out/n02_historical_service_identity_v4.csv')
          fields=list(candidates[0].keys())+['n02_prior_service_diag','n02_prior_service_years','n02_prior_service_min_distance_m']
          with outp.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(out)
          summary={'canonical_topology_v2_sha256':CANONICAL_SHA,'snapshot_years':YEARS,'snapshot_sha256':shas,'snapshot_urls':urls,
                   'snapshot_parse_meta':parse,'diag_counts':dict(diag_counts),'base_kept_with_prior_same_service':kept_hits,
                   'csv_sha256':hashlib.sha256(outp.read_bytes()).hexdigest()}
          Path('out/n02_historical_service_identity_v4_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('DIAG_COUNTS',json.dumps(dict(diag_counts),ensure_ascii=False))
          print('BASE_KEPT_PRIOR_SERVICE',json.dumps(kept_hits,ensure_ascii=False))
          print('CSV_SHA',summary['csv_sha256'])
          if len(parse)!=len(YEARS) or len(out)!=195: raise SystemExit('coverage failure')
          PY
          sha256sum out/*
      - name: Upload N02 historical service identity audit
        uses: actions/upload-artifact@v4
        with:
          name: transit-future-n02-historical-service-v4
          path: out/
          if-no-files-found: error
          retention-days: 1
