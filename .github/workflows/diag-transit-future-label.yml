name: Diagnostic Transit Future Official BRT Mask

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mask non-rail BRT positives using official operator inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'requests==2.32.5' 'beautifulsoup4==4.13.4'
          mkdir -p input out
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/nekomario28/workers/actions/artifacts/9488546830/zip' \
            -o /tmp/v2.zip
          unzip -q /tmp/v2.zip -d input
          python3 - <<'PY'
          import csv, hashlib, json, requests, unicodedata
          from collections import Counter
          from pathlib import Path
          from bs4 import BeautifulSoup

          SRC=Path('input/transit_future_positive_labels_v2.csv')
          SRC_SHA='1beb73425ab6f1f89e4e7e02d962c20e4c7fdbc150fb0592d69d560b05eb3eab'
          if hashlib.sha256(SRC.read_bytes()).hexdigest()!=SRC_SHA: raise SystemExit('v2 SHA mismatch')
          rows=list(csv.DictReader(SRC.open(encoding='utf-8')))
          def norm(x): return ''.join(unicodedata.normalize('NFKC',str(x or '')).split())

          # Independent official operator inventory. This page explicitly separates BRT ridership
          # from ordinary rail ridership and lists the 2015 BRT stations by route.
          url='https://www.jreast.co.jp/passenger/2015_brt.html'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=60); r.raise_for_status()
          raw_sha=hashlib.sha256(r.content).hexdigest()
          soup=BeautifulSoup(r.content,'html.parser',from_encoding=r.apparent_encoding)
          text='\n'.join(soup.stripped_strings)
          if '気仙沼線BRT' not in text or '大船渡線BRT' not in text:
            raise SystemExit('official BRT page structure not recognized')

          brt_names=set()
          # Tables are route-specific; accepting a station name only when it appears in the official
          # BRT page is conservative. Non-station headings/numbers cannot match our candidate names.
          for tr in soup.find_all('tr'):
            cells=[' '.join(td.stripped_strings) for td in tr.find_all(['th','td'])]
            if cells:
              name=norm(cells[0])
              if name and name not in {'駅名','気仙沼線BRT','大船渡線BRT'}:
                brt_names.add(name)
          # HTML variants may not use table markup; seed only route rows verified by visible text.
          for c in rows:
            n=norm(c['future_station'])
            if n and n in norm(text):
              # Restrict text fallback to JR East's two official BRT route identities.
              if ('東日本旅客鉄道/大船渡線' in c['future_operator_lines'] or
                  '東日本旅客鉄道/気仙沼線' in c['future_operator_lines']):
                brt_names.add(n)

          out=[]; masked=[]; counts=Counter()
          for c in rows:
            prev=(c['final_positive_v2']=='True')
            is_brt=(norm(c['future_station']) in brt_names and
                    ('東日本旅客鉄道/大船渡線' in c['future_operator_lines'] or
                     '東日本旅客鉄道/気仙沼線' in c['future_operator_lines']))
            final=prev and not is_brt
            if prev and is_brt:
              masked.append({'station':c['future_station'],'class':c['class'],'from_year':c['from_year'],'to_year':c['to_year'],'future_operator_lines':c['future_operator_lines']})
            if final: counts[c['class']]+=1
            out.append({**c,'official_brt_mask':is_brt,'final_positive_v3':final,
                        'final_positive_reason_v3':'official_brt_excluded' if prev and is_brt else c['final_positive_reason_v2']})

          fields=list(rows[0].keys())+['official_brt_mask','final_positive_v3','final_positive_reason_v3']
          p=Path('out/transit_future_positive_labels_v3.csv')
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(out)
          summary={'input_v2_sha256':SRC_SHA,'official_brt_url':url,'official_brt_page_sha256':raw_sha,
                   'masked_positive_count':len(masked),'masked_positives':masked,
                   'final_positive_by_class':dict(counts),'final_positive_total':sum(counts.values()),
                   'csv_sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          q=Path('out/transit_future_positive_labels_v3_summary.json')
          q.write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('BRT_PAGE_SHA',raw_sha)
          print('MASKED',json.dumps(masked,ensure_ascii=False))
          print('FINAL_POSITIVE_BY_CLASS',json.dumps(dict(counts),ensure_ascii=False))
          print('FINAL_POSITIVE_TOTAL',sum(counts.values()))
          print('CSV_SHA',summary['csv_sha256'])
          if not masked: raise SystemExit('expected official BRT contamination but found none')
          PY
          sha256sum out/*
      - name: Upload BRT-masked label freeze
        uses: actions/upload-artifact@v4
        with:
          name: transit-future-positive-labels-v3
          path: out/
          if-no-files-found: error
          retention-days: 1
