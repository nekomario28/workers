name: Diagnostic Transit Future Continuous Rail Infill Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Audit continuous local rail geometry for infill positives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'requests==2.32.5' 'pyshp==2.3.1'
          mkdir -p input out
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/nekomario28/workers/actions/artifacts/9488504736/zip' \
            -o /tmp/v1.zip
          unzip -q /tmp/v1.zip -d input
          python3 - <<'PY'
          import csv, hashlib, io, json, math, requests, unicodedata, zipfile
          from collections import Counter, defaultdict
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import shapefile

          SRC=Path('input/transit_future_positive_labels_v1.csv')
          SRC_SHA='2d33b20b8cdfbb75621e62d86dc562af9d5c41e9855c8a8c753f0fa1f7a423f7'
          if hashlib.sha256(SRC.read_bytes()).hexdigest()!=SRC_SHA:
            raise SystemExit('positive-v1 input SHA mismatch')
          rows=list(csv.DictReader(SRC.open(encoding='utf-8')))
          if len(rows)!=195: raise SystemExit(f'expected 195 rows, got {len(rows)}')

          # Fixed before this audit. 150 m tolerates annual geometry simplification while
          # remaining far below ordinary inter-station distances. This is a data-quality
          # boundary, not a performance-tuned threshold.
          CONTINUITY_M=150.0
          ALLOWED={'11','12','13','14','15','16','21','22','23','24','25'}

          def norm(x): return ''.join(unicodedata.normalize('NFKC',str(x or '')).split())
          def urls_for(y):
            yy=y%100
            return [f'https://nlftp.mlit.go.jp/ksj/gml/data/N02/N02-{yy:02d}/N02-{yy:02d}_GML.zip',
                    f'https://nlftp.mlit.go.jp/ksj/gml/data/N02/N02-{yy:02d}/N02-{yy:02d}.zip']
          def fetch(y):
            last=None
            for u in urls_for(y):
              try:
                r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=120)
                if r.status_code==200 and r.content[:2]==b'PK': return y,u,r.content
                last=f'{r.status_code} {r.content[:16]!r}'
              except Exception as e: last=repr(e)
            raise RuntimeError(f'{y}: {last}')
          def open_reader(z, names, candidates):
            files=[]
            for n in names:
              lo=n.lower()
              if lo.endswith('.shp') and any(k in lo for k in candidates): files.append(n)
            files=sorted(files,key=lambda n:(0 if '/utf-8/' in n.lower() else 1,n))
            for shp in files:
              base=shp[:-4]
              need={e:next((n for n in names if n.lower()==(base+e).lower()),None) for e in ['.shp','.shx','.dbf']}
              if not all(need.values()): continue
              for enc in (['utf-8','cp932'] if '/utf-8/' in shp.lower() else ['cp932','utf-8']):
                try:
                  rdr=shapefile.Reader(shp=io.BytesIO(z.read(need['.shp'])),shx=io.BytesIO(z.read(need['.shx'])),dbf=io.BytesIO(z.read(need['.dbf'])),encoding=enc)
                  if len(rdr): _=rdr.record(0)
                  return rdr,shp,enc
                except UnicodeDecodeError: pass
            return None,None,None
          def point_seg_m(lat,lon,a,b):
            # local equirectangular projection around the candidate point
            R=6371000.0; cl=math.cos(math.radians(lat))
            ax=math.radians(a[0]-lon)*R*cl; ay=math.radians(a[1]-lat)*R
            bx=math.radians(b[0]-lon)*R*cl; by=math.radians(b[1]-lat)*R
            vx=bx-ax; vy=by-ay; den=vx*vx+vy*vy
            if den<=1e-12: return math.hypot(ax,ay)
            t=max(0.0,min(1.0,-(ax*vx+ay*vy)/den))
            return math.hypot(ax+t*vx,ay+t*vy)
          def shape_dist_m(lat,lon,shape):
            pts=shape.points
            if not pts: return float('inf')
            starts=list(shape.parts)+[len(pts)]; best=float('inf')
            for pi in range(len(starts)-1):
              part=pts[starts[pi]:starts[pi+1]]
              if len(part)==1:
                best=min(best,point_seg_m(lat,lon,part[0],part[0]))
              else:
                for a,b in zip(part,part[1:]): best=min(best,point_seg_m(lat,lon,a,b))
            return best
          def parse_sections(y,b):
            z=zipfile.ZipFile(io.BytesIO(b)); names=z.namelist()
            rdr,src,enc=open_reader(z,names,['railroadsection','railwaysection'])
            if rdr is None: raise SystemExit(f'{y}: RailroadSection shapefile not found')
            fields=[f[0] for f in rdr.fields[1:]]
            for need in ['N02_001','N02_003','N02_004']:
              if need not in fields: raise SystemExit(f'{y}: section missing {need}; fields={fields}')
            byline=defaultdict(list); n=0
            for sr in rdr.iterShapeRecords():
              d=dict(zip(fields,sr.record)); typ=str(d.get('N02_001','')).strip()
              if typ not in ALLOWED: continue
              line=norm(d.get('N02_003')); op=norm(d.get('N02_004'))
              if not line: continue
              byline[line].append({'shape':sr.shape,'op':op,'type':typ}); n+=1
            return byline, {'rows':n,'source':src,'encoding':enc}

          # Existing-line positives need every annual snapshot from cutoff through to-year.
          infill=[r for r in rows if r['high_precision_positive']=='True' and r['class']=='existing_line_infill_candidate']
          years=sorted({y for r in infill for y in range(int(r['from_year']),int(r['to_year'])+1)})
          blobs={}; urls={}; shas={}
          with ThreadPoolExecutor(max_workers=4) as ex:
            futs={ex.submit(fetch,y):y for y in years}
            for fut in as_completed(futs):
              y,u,b=fut.result(); blobs[y]=b; urls[y]=u; shas[y]=hashlib.sha256(b).hexdigest(); print('FETCH',y,len(b),shas[y])
          if set(blobs)!=set(years): raise SystemExit('annual snapshot coverage incomplete')
          sections={}; parse={}
          for y in years:
            sections[y],parse[y]=parse_sections(y,blobs[y]); print('PARSE',y,parse[y])

          continuity={}; rejected=[]; counts=Counter()
          for r in infill:
            pairs=[]
            for token in r['future_operator_lines'].split(';'):
              if '/' in token:
                op,line=token.split('/',1); pairs.append((norm(op),norm(line)))
            lat=float(r['lat']); lon=float(r['lon']); per=[]
            for y in range(int(r['from_year']),int(r['to_year'])+1):
              candidates=[]
              for op,line in pairs:
                for seg in sections[y].get(line,[]):
                  # Same line is sufficient spatially; exact operator is preferred diagnostically.
                  d=shape_dist_m(lat,lon,seg['shape'])
                  candidates.append((d,seg['op']==op,seg['op'],seg['type'],line))
              candidates.sort(key=lambda x:(x[0],not x[1]))
              if candidates:
                d,exact,op,typ,line=candidates[0]
                per.append({'year':y,'distance_m':round(d,2),'exact_operator':exact,'operator':op,'type':typ,'line':line})
              else:
                per.append({'year':y,'distance_m':None,'exact_operator':False,'operator':'','type':'','line':''})
            continuous=all(x['distance_m'] is not None and x['distance_m']<=CONTINUITY_M for x in per)
            bad=[x for x in per if x['distance_m'] is None or x['distance_m']>CONTINUITY_M]
            continuity[(r['from_year'],r['to_year'],r['future_station'],r['lat'],r['lon'])]=(continuous,per)
            counts['continuous' if continuous else 'discontinuous']+=1
            if not continuous:
              rejected.append({'from_year':r['from_year'],'to_year':r['to_year'],'station':r['future_station'],'operator_lines':r['future_operator_lines'],'bad_years':bad})

          out=[]; final_counts=Counter()
          for r in rows:
            key=(r['from_year'],r['to_year'],r['future_station'],r['lat'],r['lon'])
            cont,per=continuity.get(key,(None,[]))
            hp=(r['high_precision_positive']=='True')
            if r['class']=='existing_line_infill_candidate':
              final=hp and cont is True
              reason='continuous_existing_line_infill' if final else ('discontinuous_local_rail' if hp else r['positive_reason'])
            else:
              final=hp
              reason=r['positive_reason'] if hp else r['positive_reason']
            if final: final_counts[r['class']]+=1
            out.append({**r,'continuous_local_rail': '' if cont is None else cont,
                        'continuity_trace_json':json.dumps(per,ensure_ascii=False,separators=(',',':')) if per else '',
                        'final_positive_v2':final,'final_positive_reason_v2':reason})

          fields=list(rows[0].keys())+['continuous_local_rail','continuity_trace_json','final_positive_v2','final_positive_reason_v2']
          p=Path('out/transit_future_positive_labels_v2.csv')
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(out)
          summary={'input_v1_sha256':SRC_SHA,'continuity_threshold_m':CONTINUITY_M,'annual_years':years,
                   'snapshot_urls':urls,'snapshot_sha256':shas,'parse_meta':parse,
                   'infill_continuity_counts':dict(counts),'rejected_infill':rejected,
                   'final_positive_by_class':dict(final_counts),'final_positive_total':sum(final_counts.values()),
                   'csv_sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          Path('out/transit_future_positive_labels_v2_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('INFILL_CONTINUITY',json.dumps(dict(counts),ensure_ascii=False))
          print('REJECTED_INFILL',json.dumps(rejected,ensure_ascii=False))
          print('FINAL_POSITIVE_BY_CLASS',json.dumps(dict(final_counts),ensure_ascii=False))
          print('FINAL_POSITIVE_TOTAL',sum(final_counts.values()))
          print('CSV_SHA',summary['csv_sha256'])
          if len(out)!=195: raise SystemExit('row coverage failure')
          PY
          sha256sum out/*
      - name: Upload continuous-rail positive audit
        uses: actions/upload-artifact@v4
        with:
          name: transit-future-positive-labels-v2
          path: out/
          if-no-files-found: error
          retention-days: 1
