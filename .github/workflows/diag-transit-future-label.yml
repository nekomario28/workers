name: Diagnostic Transit Future Topology Labels

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Classify apparent additions using cutoff rail topology
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'requests==2.32.5' 'pyshp==2.3.1'
          mkdir -p out
          python3 - <<'PY'
          import csv, hashlib, io, json, math, requests, unicodedata, zipfile
          from collections import defaultdict
          from pathlib import Path
          import shapefile

          YEARS=[2011,2015,2020,2025]; CODES={2011:'11',2015:'15',2020:'20',2025:'25'}
          GROUP_M=300.0; SAME_NAME_M=500.0; RENAME_M=300.0; PRIOR_STATION_M=300.0; RAIL_M=100.0
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0'})
          def norm(x): return ''.join(unicodedata.normalize('NFKC',str(x or '')).split())
          def hav(a,b):
            lat1,lon1=a; lat2,lon2=b; R=6371000.0
            p1=math.radians(lat1); p2=math.radians(lat2); dp=math.radians(lat2-lat1); dl=math.radians(lon2-lon1)
            q=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
            return 2*R*math.asin(min(1,math.sqrt(q)))
          def rep(shape):
            pts=shape.points
            return (sum(p[1] for p in pts)/len(pts),sum(p[0] for p in pts)/len(pts))
          def point_segment_m(pt,a,b):
            lat0,lon0=pt; c=math.cos(math.radians(lat0)); sx=111320.0*c; sy=110540.0
            ax=(a[0]-lon0)*sx; ay=(a[1]-lat0)*sy; bx=(b[0]-lon0)*sx; by=(b[1]-lat0)*sy
            vx=bx-ax; vy=by-ay; den=vx*vx+vy*vy
            if den==0: return math.hypot(ax,ay)
            t=max(0.0,min(1.0,-(ax*vx+ay*vy)/den)); x=ax+t*vx; y=ay+t*vy
            return math.hypot(x,y)
          def rail_dist(pt,rail):
            pts=rail['points']
            if len(pts)==1: return hav(pt,(pts[0][1],pts[0][0]))
            best=1e30
            for a,b in zip(pts,pts[1:]): best=min(best,point_segment_m(pt,a,b))
            return best
          def group(records):
            n=len(records); parent=list(range(n))
            def find(x):
              while parent[x]!=x: parent[x]=parent[parent[x]]; x=parent[x]
              return x
            def union(a,b):
              a=find(a); b=find(b)
              if a!=b: parent[b]=a
            by=defaultdict(list)
            for i,r in enumerate(records): by[r['name_n']].append(i)
            for ids in by.values():
              for x in range(len(ids)):
                for y in range(x+1,len(ids)):
                  i,j=ids[x],ids[y]
                  if hav(records[i]['pt'],records[j]['pt'])<=GROUP_M: union(i,j)
            comp=defaultdict(list)
            for i in range(n): comp[find(i)].append(i)
            out=[]
            for ids in comp.values():
              rs=[records[i] for i in ids]
              out.append({'name':rs[0]['name'],'name_n':rs[0]['name_n'],
                'pt':(sum(r['pt'][0] for r in rs)/len(rs),sum(r['pt'][1] for r in rs)/len(rs)),
                'tuples':sorted(set((r['op'],r['line']) for r in rs)),'members':len(rs)})
            return out
          def open_reader(z,names,kind,year):
            fs=sorted([n for n in names if n.lower().endswith(f'_{kind.lower()}.shp')],key=lambda x:(0 if '/UTF-8/' in x else 1,x))
            for shpname in fs:
              base=shpname[:-4]; need={e:next((n for n in names if n.lower()==(base+e).lower()),None) for e in ['.shp','.shx','.dbf']}
              if not all(need.values()): continue
              for enc in (['utf-8','cp932'] if '/UTF-8/' in shpname else ['cp932','utf-8']):
                try:
                  rdr=shapefile.Reader(shp=io.BytesIO(z.read(need['.shp'])),shx=io.BytesIO(z.read(need['.shx'])),dbf=io.BytesIO(z.read(need['.dbf'])),encoding=enc)
                  # force first record decode before returning
                  if len(rdr): _=rdr.record(0)
                  return rdr,shpname,enc
                except UnicodeDecodeError: pass
            raise RuntimeError(f'cannot read {kind} {year}')
          def load(year):
            code=CODES[year]; url=f'https://nlftp.mlit.go.jp/ksj/gml/data/N02/N02-{code}/N02-{code}_GML.zip'
            last=None
            for attempt in range(3):
              try:
                rr=s.get(url,timeout=90); rr.raise_for_status(); blob=rr.content; break
              except Exception as e:
                last=e
                if attempt==2: raise
            sha=hashlib.sha256(blob).hexdigest(); z=zipfile.ZipFile(io.BytesIO(blob)); names=z.namelist()
            sr,sfile,senc=open_reader(z,names,'Station',year); sf=[f[0] for f in sr.fields[1:]]; stations=[]
            for x in sr.iterShapeRecords():
              d=dict(zip(sf,x.record)); stations.append({'name':str(d.get('N02_005','')),'name_n':norm(d.get('N02_005')),'op':norm(d.get('N02_004')),'line':norm(d.get('N02_003')),'pt':rep(x.shape)})
            rrdr,rfile,renc=open_reader(z,names,'RailroadSection',year); rf=[f[0] for f in rrdr.fields[1:]]; rails=[]
            for x in rrdr.iterShapeRecords():
              d=dict(zip(rf,x.record)); pts=x.shape.points
              if not pts: continue
              lons=[p[0] for p in pts]; lats=[p[1] for p in pts]
              rails.append({'tuple':(norm(d.get('N02_004')),norm(d.get('N02_003'))),'points':pts,'bbox':(min(lats),max(lats),min(lons),max(lons))})
            gs=group(stations)
            print('SNAP',year,'station_rows',len(stations),'physical',len(gs),'rails',len(rails),'sha',sha,'files',sfile,senc,rfile,renc)
            return {'groups':gs,'rails':rails,'rail_tuples':set(r['tuple'] for r in rails),'sha':sha}
          snaps={y:load(y) for y in YEARS}
          def temporal(a,b):
            A=snaps[a]['groups']; B=snaps[b]['groups']; ua=set(range(len(A))); ub=set(range(len(B)))
            # unique same-name <=500m
            ca=defaultdict(list); cb=defaultdict(list)
            namesB=defaultdict(list)
            for j in ub: namesB[B[j]['name_n']].append(j)
            for i in ua:
              for j in namesB[A[i]['name_n']]:
                d=hav(A[i]['pt'],B[j]['pt'])
                if d<=SAME_NAME_M: ca[i].append((j,d)); cb[j].append((i,d))
            for i,v in list(ca.items()):
              if len(v)==1 and len(cb[v[0][0]])==1: ua.discard(i); ub.discard(v[0][0])
            # unique shared tuple <=300m rename
            ca=defaultdict(list); cb=defaultdict(list)
            for i in ua:
              ta=set(A[i]['tuples'])
              for j in ub:
                if ta.intersection(B[j]['tuples']):
                  d=hav(A[i]['pt'],B[j]['pt'])
                  if d<=RENAME_M: ca[i].append((j,d)); cb[j].append((i,d))
            pairs=[]
            for i,v in ca.items():
              if len(v)==1 and len(cb[v[0][0]])==1: pairs.append((v[0][1],i,v[0][0]))
            for d,i,j in sorted(pairs):
              if i in ua and j in ub: ua.remove(i); ub.remove(j)
            return A,B,sorted(ua),sorted(ub)
          def nearest_station(pt,A): return min((hav(pt,g['pt']) for g in A),default=1e30)
          def nearest_rail(pt,rails,tuple_filter=None):
            best=1e30
            lat,lon=pt
            for r in rails:
              if tuple_filter is not None and r['tuple'] not in tuple_filter: continue
              mnla,mxla,mnlo,mxlo=r['bbox']
              # coarse ~1.1km bounding gate, much wider than 100m canonical threshold
              if lat<mnla-0.01 or lat>mxla+0.01 or lon<mnlo-0.012 or lon>mxlo+0.012: continue
              best=min(best,rail_dist(pt,r))
            return best
          rows=[]; counts={}; sanity={}
          for a,b in zip(YEARS,YEARS[1:]):
            A,B,rem,add=temporal(a,b); cc=defaultdict(int)
            for j in add:
              g=B[j]; ns=nearest_station(g['pt'],A)
              future_t=set(g['tuples']); same=nearest_rail(g['pt'],snaps[a]['rails'],future_t); anyr=nearest_rail(g['pt'],snaps[a]['rails'])
              if ns<=PRIOR_STATION_M: cls='representation_change_suspect'
              elif same<=RAIL_M: cls='existing_line_infill_candidate'
              elif anyr<=RAIL_M: cls='existing_geometry_recode_suspect'
              elif future_t.intersection(snaps[a]['rail_tuples']): cls='extension_candidate'
              else: cls='new_line_candidate'
              cc[cls]+=1
              rows.append([a,b,g['name'],cls,round(ns,2),round(same,2) if same<1e29 else '',round(anyr,2) if anyr<1e29 else '',g['pt'][0],g['pt'][1],g['members'],';'.join('/'.join(t) for t in g['tuples'])])
              if (a,b)==(2015,2020) and g['name'] in ('高輪ゲートウェイ','梅小路京都西'): sanity[g['name']]=cls
              if (a,b)==(2020,2025) and g['name']=='新綱島': sanity[g['name']]=cls
            counts[f'{a}->{b}']=dict(cc); print('CLASS',a,b,dict(cc))
          with open('out/topology_labels.csv','w',encoding='utf-8',newline='') as f:
            w=csv.writer(f); w.writerow(['from_year','to_year','future_station','class','nearest_prior_station_m','nearest_same_line_cutoff_rail_m','nearest_any_cutoff_rail_m','lat','lon','members','future_operator_lines']); w.writerows(rows)
          expected={'高輪ゲートウェイ':'existing_line_infill_candidate','梅小路京都西':'existing_line_infill_candidate','新綱島':'new_line_candidate'}
          bad={k:(sanity.get(k),v) for k,v in expected.items() if sanity.get(k)!=v}
          summary={'rules':{'group_m':GROUP_M,'same_name_m':SAME_NAME_M,'rename_m':RENAME_M,'prior_station_m':PRIOR_STATION_M,'rail_m':RAIL_M},'counts':counts,'sanity':sanity,'raw_sha256':{str(y):snaps[y]['sha'] for y in YEARS}}
          Path('out/topology_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('SANITY',json.dumps(sanity,ensure_ascii=False)); print('SUMMARY',json.dumps(summary,ensure_ascii=False))
          if bad: raise SystemExit('TOPOLOGY_SANITY_FAIL '+json.dumps(bad,ensure_ascii=False))
          PY
          sha256sum out/*
      - name: Upload topology label audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transit-future-topology-label-audit
          path: out/
          if-no-files-found: warn
          retention-days: 1
