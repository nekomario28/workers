name: Diagnostic Transit Future N05 Spatial Relation Audit v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Audit N02-only topology labels against research-only N05 history
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'requests==2.32.5' 'pyshp==2.3.1'
          mkdir -p out
          python3 - <<'PY'
          import csv, hashlib, io, json, math, re, requests, unicodedata, zipfile
          from collections import defaultdict, Counter
          from pathlib import Path
          import shapefile

          HEAD='cd7f9758fc1ca5b6135c136e5d92be32c6656771'
          CANONICAL_SHA='1202090e0959a8460a2babc4593672b8474e24040ff70ea136662b26bf83c2d6'
          url=f'https://raw.githubusercontent.com/nekomario28/workers/{HEAD}/tmp/transit_future_topology_labels_v2.csv'
          cb=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=60).content
          csha=hashlib.sha256(cb).hexdigest(); print('CANDIDATE_SHA',csha)
          if csha!=CANONICAL_SHA: raise SystemExit(f'canonical artifact mismatch {csha}')
          candidates=list(csv.DictReader(io.StringIO(cb.decode('utf-8'))))
          if len(candidates)!=195: raise SystemExit(f'expected 195 candidates, got {len(candidates)}')
          Path('out/topology_labels_v2.csv').write_bytes(cb)

          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0'})
          def norm(x): return ''.join(unicodedata.normalize('NFKC',str(x or '')).split())
          def hav(a,b):
            lat1,lon1=a; lat2,lon2=b; R=6371000.0
            p1=math.radians(lat1); p2=math.radians(lat2); dp=math.radians(lat2-lat1); dl=math.radians(lon2-lon1)
            q=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
            return 2*R*math.asin(min(1,math.sqrt(q)))
          def yr(v):
            m=re.search(r'(19\d{2}|20\d{2}|9999|999)',str(v or ''))
            return int(m.group(1)) if m else None

          n05url='https://nlftp.mlit.go.jp/ksj/gml/data/N05/N05-25/N05-25_GML.zip'
          for attempt in range(4):
            try:
              rr=s.get(n05url,timeout=120); rr.raise_for_status(); blob=rr.content
              if blob[:2]!=b'PK': raise RuntimeError('not ZIP')
              break
            except Exception as e:
              print('N05_FETCH_RETRY',attempt+1,repr(e))
              if attempt==3: raise
          n05sha=hashlib.sha256(blob).hexdigest(); z=zipfile.ZipFile(io.BytesIO(blob)); names=z.namelist()
          station_files=sorted([n for n in names if n.lower().endswith('station2.shp')],key=lambda n:(0 if '/UTF-8/' in n else 1,n))
          rdr=None; used=None
          for shpname in station_files:
            base=shpname[:-4]; need={e:next((n for n in names if n.lower()==(base+e).lower()),None) for e in ['.shp','.shx','.dbf']}
            if not all(need.values()): continue
            for enc in (['utf-8','cp932'] if '/UTF-8/' in shpname else ['cp932','utf-8']):
              try:
                x=shapefile.Reader(shp=io.BytesIO(z.read(need['.shp'])),shx=io.BytesIO(z.read(need['.shx'])),dbf=io.BytesIO(z.read(need['.dbf'])),encoding=enc)
                if len(x): _=x.record(0)
                rdr=x; used=(shpname,enc); break
              except UnicodeDecodeError: continue
            if rdr is not None: break
          if rdr is None: raise SystemExit('cannot decode N05 Station2')
          fields=[f[0] for f in rdr.fields[1:]]
          required={'N05_002','N05_003','N05_005b','N05_005e','N05_006','N05_011'}
          if not required.issubset(fields): raise SystemExit('missing N05 fields '+repr(sorted(required-set(fields))))
          records=[]; byrel=defaultdict(list); byname=defaultdict(list)
          for idx,sr in enumerate(rdr.iterShapeRecords()):
            d=dict(zip(fields,sr.record)); pts=sr.shape.points
            if not pts: continue
            r={'idx':idx,'name':str(d.get('N05_011','')),'name_n':norm(d.get('N05_011')),'line':str(d.get('N05_002','')),'op':str(d.get('N05_003','')),
               'start':yr(d.get('N05_005b')),'end':yr(d.get('N05_005e')),'rel':str(d.get('N05_006','')),'pt':(pts[0][1],pts[0][0])}
            records.append(r); byrel[r['rel']].append(r); byname[r['name_n']].append(r)
          print('N05',n05sha,'SOURCE',used,'ROWS',len(records),'RELATIONS',len(byrel))

          out=[]; class_counts=defaultdict(Counter); guard_counts=Counter(); match_counts=Counter()
          for c in candidates:
            fy=int(c['from_year']); ty=int(c['to_year']); pt=(float(c['lat']),float(c['lon'])); nn=norm(c['future_station'])
            same=[(hav(pt,r['pt']),r) for r in byname.get(nn,[]) if hav(pt,r['pt'])<=500]
            matched=same; mode='same_name_500m'
            if not matched:
              near=[]
              for r in records:
                if abs(r['pt'][0]-pt[0])>0.002 or abs(r['pt'][1]-pt[1])>0.003: continue
                d=hav(pt,r['pt'])
                if d<=100: near.append((d,r))
              matched=near; mode='geometry_100m_fallback'
            if matched:
              match_counts[mode]+=1; mind=min(d for d,r in matched)
              rels=sorted(set(r['rel'] for d,r in matched if d<=mind+30.0))
              local=[]; glob=[]
              for rel in rels:
                glob.extend(byrel[rel]); local.extend(r for r in byrel[rel] if hav(pt,r['pt'])<=500)
              starts=[r['start'] for r in local if r['start'] not in (None,999,9999)]
              any_pre=any(v<=fy for v in starts); any_new=any(fy<v<=ty for v in starts)
              if any_pre and any_new: audit='local_mixed_old_and_new_relations'
              elif any_pre: audit='local_preexisting_relation'
              elif any_new: audit='local_new_relation_in_interval'
              elif starts and all(v>ty for v in starts): audit='local_relation_starts_after_target'
              else: audit='local_relation_start_unknown'
              local_names=sorted(set(r['name'] for r in local)); nearest=round(mind,2)
            else:
              match_counts['none']+=1; rels=[]; audit='no_n05_match'; local_names=[]; nearest=None; mode='none'

            # Commercial-safe guard uses only fields already present in the N02-derived v2 table.
            # The 300m threshold was pre-existing in v2; this audit does not tune a new threshold on N05.
            cls=c['class']; near300=(c['near_prior_station_300m']=='True')
            if cls in ('new_line_candidate','extension_candidate'):
              guard='keep_new_line_or_extension'
            elif cls=='existing_line_infill_candidate' and not near300:
              guard='keep_clean_infill'
            elif cls=='existing_line_infill_candidate' and near300:
              guard='exclude_infill_near_prior_300m'
            else:
              guard='exclude_geometry_recode_suspect'
            guard_counts[(guard,audit)]+=1; class_counts[cls][audit]+=1
            out.append({**c,'n02_commercial_guard':guard,'n05_match_mode':mode,'n05_nearest_m':nearest,'n05_relation_ids':';'.join(rels),'n05_spatial_audit':audit,'n05_local_history_names':' | '.join(local_names)})

          cols=list(candidates[0].keys())+['n02_commercial_guard','n05_match_mode','n05_nearest_m','n05_relation_ids','n05_spatial_audit','n05_local_history_names']
          with open('out/n05_spatial_relation_audit_v2.csv','w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=cols); w.writeheader(); w.writerows(out)

          kept=[r for r in out if r['n02_commercial_guard'].startswith('keep_')]
          clear=[r for r in kept if r['n05_spatial_audit']=='local_new_relation_in_interval']
          residual=[r for r in kept if r['n05_spatial_audit']!='local_new_relation_in_interval']
          ext=[r for r in out if r['class'] in ('new_line_candidate','extension_candidate')]
          bad_ext=[r for r in ext if r['n05_spatial_audit']!='local_new_relation_in_interval']
          lookup={(r['from_year'],r['to_year'],r['future_station']):r for r in out}
          checks={k:lookup.get(key,{}).get('n05_spatial_audit') for k,key in {
            '大阪梅田':('2015','2020','大阪梅田'),'羽田空港第3ターミナル':('2015','2020','羽田空港第3ターミナル'),
            '高輪ゲートウェイ':('2015','2020','高輪ゲートウェイ'),'梅小路京都西':('2015','2020','梅小路京都西'),'新綱島':('2020','2025','新綱島')}.items()}
          expected={'大阪梅田':'local_mixed_old_and_new_relations','羽田空港第3ターミナル':'local_mixed_old_and_new_relations','高輪ゲートウェイ':'local_new_relation_in_interval','梅小路京都西':'local_new_relation_in_interval','新綱島':'local_new_relation_in_interval'}
          bad={k:(checks.get(k),v) for k,v in expected.items() if checks.get(k)!=v}
          summary={
            'canonical_topology_v2_sha256':CANONICAL_SHA,'n05_raw_sha256':n05sha,'candidate_rows':len(candidates),
            'match_counts':dict(match_counts),'class_audit_counts':{k:dict(v) for k,v in class_counts.items()},
            'commercial_guard_kept':len(kept),'commercial_guard_clear_new':len(clear),
            'commercial_guard_research_precision_clear_new':len(clear)/len(kept) if kept else None,
            'commercial_guard_residual':[{'from_year':r['from_year'],'to_year':r['to_year'],'station':r['future_station'],'audit':r['n05_spatial_audit'],'nearest_prior_station_m':r['nearest_prior_station_m']} for r in residual],
            'sanity':checks,
          }
          Path('out/n05_spatial_relation_audit_v2_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('SUMMARY',json.dumps(summary,ensure_ascii=False))
          if bad: raise SystemExit('N05_SPATIAL_SANITY_FAIL '+json.dumps(bad,ensure_ascii=False))
          if bad_ext: raise SystemExit('NEW_LINE_EXTENSION_AUDIT_FAIL '+json.dumps([(r['future_station'],r['n05_spatial_audit']) for r in bad_ext],ensure_ascii=False))
          PY
          sha256sum out/*
      - name: Upload N05 spatial relation audit v2
        uses: actions/upload-artifact@v4
        with:
          name: transit-future-n05-spatial-relation-audit-v2
          path: out/
          if-no-files-found: error
          retention-days: 1
