name: Diagnostic Holdout Demand Inspect 2021

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect 2021 cutoff-safe resident-registry xlsx workbooks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'openpyxl==3.1.5' 'requests==2.32.5'
          mkdir -p out
          python3 - <<'PY'
          import requests,hashlib
          from pathlib import Path
          import openpyxl
          for label,sid in [('2021_main','000040306659'),('2021_age','000040306661')]:
            u=f'https://www.e-stat.go.jp/stat-search/file-download?fileKind=0&statInfId={sid}'
            r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=60); r.raise_for_status(); Path(f'out/{label}.xlsx').write_bytes(r.content)
            print('SHA',label,hashlib.sha256(r.content).hexdigest())
            wb=openpyxl.load_workbook(f'out/{label}.xlsx',data_only=True,read_only=True)
            print('SHEETS',label,wb.sheetnames)
            for ws in wb.worksheets:
              print('SHEET',ws.title,ws.max_row,ws.max_column)
              for ri,row in enumerate(ws.iter_rows(min_row=1,max_row=min(ws.max_row,18),values_only=True),start=1):
                vals=[f'{i}:{v}' for i,v in enumerate(row) if v not in (None,'')]
                if vals: print('HEAD',label,ri,' || '.join(vals)[:7000])
              hit=0
              for ri,row in enumerate(ws.iter_rows(values_only=True),start=1):
                code=str(row[0] or '')
                if code.startswith('13101') or code.startswith('40131'):
                  vals=[f'{i}:{v}' for i,v in enumerate(row) if v not in (None,'')]
                  print('TARGET',label,ri,' || '.join(vals)[:8000]); hit+=1
                  if hit>=6: break
          PY
          sha256sum out/*
      - name: Upload Demand inspection
        uses: actions/upload-artifact@v4
        with:
          name: holdout-demand-inspection-2021
          path: out/
          if-no-files-found: error
          retention-days: 1
