name: Diagnostic Holdout Known Future Fukuoka Full Archive

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Crawl 2006-2022 pre-cutoff JCSC METI-derived archive
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'beautifulsoup4==4.13.4' 'requests==2.32.5'
          mkdir -p out
          python3 - <<'PY'
          import csv, re, time, hashlib, json
          from datetime import date
          from urllib.parse import urljoin
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          CUT=date(2022,3,31); H0=date(2022,4,1); H1=date(2024,3,31)
          NEWROOT='https://www.jcsc.or.jp/sc_data/sc_open/daitenhou'
          OLDROOT='https://www.jcsc.or.jp/public_policy/location/index.html'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0'})
          errors=[]; pages={}

          def get(url, allow404=False):
            try:
              r=s.get(url,timeout=30)
              if allow404 and r.status_code==404: return None
              r.raise_for_status(); return r
            except Exception as e:
              errors.append((url,repr(e))); return None

          # Old archive uses stable /public_policy/location/YYYY/YYYYMM.html paths.
          # Probe all months 2006-2014 so absence of an index link cannot silently hide a page.
          old_probe={}
          for y in range(2006,2015):
            for m in range(1,13):
              u=f'https://www.jcsc.or.jp/public_policy/location/{y}/{y}{m:02d}.html'
              try:
                r=s.get(u,timeout=30)
                old_probe[f'{y}-{m:02d}']=r.status_code
                if r.status_code==200 and '大店立地法' in r.text:
                  pages[(y,m,u)]=r.text
                elif r.status_code not in (200,404):
                  errors.append((u,f'HTTP {r.status_code}'))
              except Exception as e:
                errors.append((u,repr(e)))
              time.sleep(0.01)

          # New archive: discover year/month pages from the live index, but stop at cutoff.
          root=get(NEWROOT)
          if root is None: raise SystemExit('cannot fetch JCSC current archive root')
          soup=BeautifulSoup(root.text,'html.parser')
          year_links=[]
          for a in soup.find_all('a',href=True):
            t=' '.join(a.stripped_strings); u=urljoin(root.url,a['href'])
            m=re.fullmatch(r'(20\d{2})年',t)
            if m and 2015 <= int(m.group(1)) <= 2022:
              year_links.append((int(m.group(1)),u))
          seen=set(); year_links=[x for x in year_links if not (x[1] in seen or seen.add(x[1]))]
          for y,yu in year_links:
            yr=get(yu)
            if yr is None: continue
            ys=BeautifulSoup(yr.text,'html.parser')
            for a in ys.find_all('a',href=True):
              t=' '.join(a.stripped_strings); u=urljoin(yr.url,a['href'])
              mm=re.search(r'(20\d{2})年\s*(\d{1,2})月',t)
              if not mm or '/pt_location/' not in u: continue
              yy,mo=map(int,mm.groups())
              if yy!=y or date(yy,mo,1)>date(2022,3,1): continue
              if any(k[0]==yy and k[1]==mo and k[2]==u for k in pages): continue
              mr=get(u)
              if mr is not None: pages[(yy,mo,u)]=mr.text
              time.sleep(0.01)

          # Root can expose recent months outside year pages.
          for a in soup.find_all('a',href=True):
            t=' '.join(a.stripped_strings); u=urljoin(root.url,a['href'])
            mm=re.search(r'(20\d{2})年\s*(\d{1,2})月',t)
            if mm and '/pt_location/' in u:
              yy,mo=map(int,mm.groups())
              if 2015<=yy<=2022 and date(yy,mo,1)<=date(2022,3,1):
                key=(yy,mo,u)
                if key not in pages:
                  mr=get(u)
                  if mr is not None: pages[key]=mr.text

          rows=[]; hits=[]
          for (y,m,u),html in sorted(pages.items()):
            ps=BeautifulSoup(html,'html.parser')
            for tr in ps.find_all('tr'):
              cells=[' '.join(td.stripped_strings) for td in tr.find_all(['th','td'])]
              if not cells or '福岡市' not in ' | '.join(cells): continue
              joined=' || '.join(cells)
              dates=[]
              for yy,mm,dd in re.findall(r'(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日',joined):
                try: dates.append(date(int(yy),int(mm),int(dd)))
                except ValueError: pass
              rec={'filing_year':y,'filing_month':m,'source_url':u,'dates':','.join(d.isoformat() for d in dates),'cells':joined}
              rows.append(rec)
              if date(y,m,1)<=date(2022,3,1) and any(H0<=d<=H1 for d in dates): hits.append(rec)

          # Deduplicate page aliases by filing month + exact row content.
          def dedup(rs):
            out=[]; seen=set()
            for r in rs:
              k=(r['filing_year'],r['filing_month'],r['cells'])
              if k in seen: continue
              seen.add(k); out.append(r)
            return out
          rows=dedup(rows); hits=dedup(hits)

          for name,data in [('fukuoka_all_rows_2006_2022.tsv',rows),('fukuoka_holdout_h24_candidates.tsv',hits)]:
            p=Path('out')/name
            with p.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['filing_year','filing_month','source_url','dates','cells'],delimiter='\t'); w.writeheader(); w.writerows(data)

          meta={
            'cutoff':'2022-03-31','answer_window':'2022-04-01..2024-03-31',
            'old_month_urls_probed':len(old_probe),'old_http_200':sum(v==200 for v in old_probe.values()),
            'old_http_404':sum(v==404 for v in old_probe.values()),'new_year_links':len(year_links),
            'parsed_month_pages':len(pages),'fukuoka_rows':len(rows),'h24_candidate_rows':len(hits),'errors':errors,
            'page_range':[min((f'{y:04d}-{m:02d}' for y,m,u in pages),default=None),max((f'{y:04d}-{m:02d}' for y,m,u in pages),default=None)],
            'transport_note':'JCSC tables state they are compiled from METI/prefecture/designated-city new-store notifications; used as archival transport for Fukuoka City.',
          }
          mp=Path('out/scan_meta.json'); mp.write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          print('META',json.dumps(meta,ensure_ascii=False))
          print('=== HOLDOUT H24 CANDIDATES ===')
          for r in hits: print(r['filing_year'],r['filing_month'],r['dates'],r['cells'])
          for p in sorted(Path('out').iterdir()): print('SHA',p.name,hashlib.sha256(p.read_bytes()).hexdigest())
          if errors: raise SystemExit('archive crawl had fetch errors; do not freeze')
          if not pages or min(y for y,m,u in pages)>2006 or max(y for y,m,u in pages)<2022: raise SystemExit('archive range incomplete')
          PY
      - name: Upload Fukuoka full archive evidence
        uses: actions/upload-artifact@v4
        with:
          name: holdout-known-future-fukuoka-full-archive
          path: out/
          if-no-files-found: error
          retention-days: 1
