name: Diagnostic Holdout NTA Coverage

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit exact-cutoff gBizINFO daily coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out src
          sha='8d5276bec8a245d48abfaaa5c3358aa394194bea'
          curl --fail --location --retry 3 --retry-all-errors \
            "https://codeload.github.com/code4fukui/gBizINFO/tar.gz/${sha}" -o out/gBizINFO.tar.gz
          tar -xzf out/gBizINFO.tar.gz -C src --strip-components=1
          python3 - <<'PY'
          import glob,re,json,hashlib
          from pathlib import Path
          files=glob.glob('src/data/diff_*_created.csv')
          dates=[]
          for f in files:
            m=re.search(r'diff_(\d{8})_created\.csv$',f)
            if m: dates.append(m.group(1))
          term=[]
          for f in glob.glob('src/data/diff_*_terminated.csv'):
            m=re.search(r'diff_(\d{8})_terminated\.csv$',f)
            if m: term.append(m.group(1))
          dates=sorted(set(dates)); term=sorted(set(term))
          print('CREATED_COUNT',len(dates),'MIN',dates[0] if dates else None,'MAX',dates[-1] if dates else None)
          print('TERMINATED_COUNT',len(term),'MIN',term[0] if term else None,'MAX',term[-1] if term else None)
          windows={
            'prev365':('20200401','20210331'),
            'prev90':('20210101','20210331'),
            'cur365':('20210401','20220331'),
            'cur90':('20220101','20220331'),
          }
          audit={}
          for name,(a,b) in windows.items():
            c=[d for d in dates if a<=d<=b]; t=[d for d in term if a<=d<=b]
            audit[name]={'start':a,'end':b,'created_files':len(c),'terminated_files':len(t),'first_created':c[0] if c else None,'last_created':c[-1] if c else None,'first_terminated':t[0] if t else None,'last_terminated':t[-1] if t else None}
            print('WINDOW',name,a,b,'created',len(c),'terminated',len(t),'first',c[0] if c else None,'last',c[-1] if c else None)
          Path('out/coverage.json').write_text(json.dumps({'source_sha':'8d5276bec8a245d48abfaaa5c3358aa394194bea','created_min':dates[0] if dates else None,'created_max':dates[-1] if dates else None,'terminated_min':term[0] if term else None,'terminated_max':term[-1] if term else None,'windows':audit},ensure_ascii=False,indent=2),encoding='utf-8')
          print('COVERAGE_SHA',hashlib.sha256(Path('out/coverage.json').read_bytes()).hexdigest())
          PY
          sha256sum out/*
      - name: Upload NTA coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: holdout-nta-coverage
          path: out/
          if-no-files-found: error
          retention-days: 1
