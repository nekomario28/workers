name: Diagnostic Holdout Physical Inspect FY2022 FY2023

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect official FY2022/FY2023 building-start workbooks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'openpyxl==3.1.5' 'xlrd==2.0.1' 'requests==2.32.5'
          mkdir -p out
          python3 - <<'PY'
          import hashlib, requests
          from pathlib import Path
          import openpyxl, xlrd
          SOURCES={'FY2022':'000040052251','FY2023':'000040179628'}
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          for label,sid in SOURCES.items():
            u=f'https://www.e-stat.go.jp/stat-search/file-download?fileKind=0&statInfId={sid}'
            r=s.get(u,timeout=60); r.raise_for_status(); b=r.content
            sha=hashlib.sha256(b).hexdigest(); print('RAW',label,sid,len(b),b[:8],sha)
            if b[:4]==b'PK\x03\x04':
              p=Path(f'out/{label}.xlsx'); p.write_bytes(b)
              wb=openpyxl.load_workbook(p,data_only=True,read_only=True)
              print('FORMAT',label,'OOXML','SHEETS',[(ws.title,ws.max_row,ws.max_column) for ws in wb.worksheets])
              for ws in wb.worksheets:
                for ri,row in enumerate(ws.iter_rows(min_row=1,max_row=min(ws.max_row,18),values_only=True),1):
                  vals=[f'{i}:{v}' for i,v in enumerate(row) if v not in (None,'')]
                  if vals: print('HEAD',label,ws.title,ri,' || '.join(vals)[:9000])
                hit=0
                for ri,row in enumerate(ws.iter_rows(values_only=True),1):
                  txt=' | '.join(str(v) for v in row if v not in (None,''))
                  if '13101' in txt or '40131' in txt or '千代田区' in txt or '福岡市東区' in txt:
                    vals=[f'{i}:{v}' for i,v in enumerate(row) if v not in (None,'')]
                    print('TARGET',label,ws.title,ri,' || '.join(vals)[:12000]); hit+=1
                    if hit>=8: break
            elif b[:8]==bytes.fromhex('D0CF11E0A1B11AE1'):
              p=Path(f'out/{label}.xls'); p.write_bytes(b)
              wb=xlrd.open_workbook(file_contents=b)
              print('FORMAT',label,'BIFF8/OLE','SHEETS',[(sh.name,sh.nrows,sh.ncols) for sh in wb.sheets()])
              for sh in wb.sheets():
                for ri in range(min(sh.nrows,18)):
                  row=sh.row_values(ri); vals=[f'{i}:{v}' for i,v in enumerate(row) if v not in (None,'')]
                  if vals: print('HEAD',label,sh.name,ri+1,' || '.join(vals)[:9000])
                hit=0
                for ri in range(sh.nrows):
                  row=sh.row_values(ri); txt=' | '.join(str(v) for v in row if v not in (None,''))
                  if '13101' in txt or '40131' in txt or '千代田区' in txt or '福岡市東区' in txt:
                    vals=[f'{i}:{v}' for i,v in enumerate(row) if v not in (None,'')]
                    print('TARGET',label,sh.name,ri+1,' || '.join(vals)[:12000]); hit+=1
                    if hit>=8: break
            else:
              raise SystemExit(f'unknown workbook signature {label} {b[:16]!r}')
          PY
          sha256sum out/*
      - name: Upload Physical inspection
        uses: actions/upload-artifact@v4
        with:
          name: holdout-physical-inspection-fy2022-fy2023
          path: out/
          if-no-files-found: error
          retention-days: 1
