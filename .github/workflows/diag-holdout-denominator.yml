name: Diagnostic Holdout Physical

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect FY2022 and FY2023 official Building Starts workbooks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'xlrd==2.0.1' 'requests==2.32.5'
          mkdir -p out
          python3 - <<'PY'
          import hashlib, requests, xlrd
          from pathlib import Path
          for label,sid in [('fy2022','000040052251'),('fy2023','000040179628')]:
            u=f'https://www.e-stat.go.jp/stat-search/file-download?fileKind=0&statInfId={sid}'
            r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=60); print('HTTP',label,r.status_code,len(r.content)); r.raise_for_status()
            Path(f'out/{label}.xls').write_bytes(r.content)
            print('SHA',label,hashlib.sha256(r.content).hexdigest(),r.content[:8])
            wb=xlrd.open_workbook(file_contents=r.content)
            print('SHEETS',label,[(s.name,s.nrows,s.ncols) for s in wb.sheets()])
            for sh in wb.sheets():
              print('HEADER',label,sh.name)
              for i in range(min(16,sh.nrows)):
                vals=[sh.cell_value(i,j) for j in range(min(60,sh.ncols))]
                compact=' || '.join(f'{j}:{v}' for j,v in enumerate(vals) if v not in ('',None))
                if compact: print('HROW',i,compact[:5000])
              for i in range(sh.nrows):
                vals=[sh.cell_value(i,j) for j in range(sh.ncols)]
                text=' | '.join(str(v) for v in vals)
                if '13101' in text or '40131' in text:
                  compact=' || '.join(f'{j}:{v}' for j,v in enumerate(vals) if v not in ('',None))
                  print('TARGET',label,sh.name,i,compact[:6000])
          PY
          sha256sum out/*
      - name: Upload Physical inspection
        uses: actions/upload-artifact@v4
        with:
          name: holdout-physical-inspection
          path: out/
          if-no-files-found: error
          retention-days: 1
