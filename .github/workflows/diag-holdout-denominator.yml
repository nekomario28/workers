name: Diagnostic Holdout Denominator

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover and fetch 2016 Economic Census municipal workbook
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'beautifulsoup4==4.13.4' 'requests==2.32.5' 'openpyxl==3.1.5' 'xlrd==2.0.1'
          mkdir -p out
          python3 - <<'PY'
          import re, requests, pathlib
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          urls=[
            'https://www.e-stat.go.jp/stat-search/database?statdisp_id=0003218500',
            'https://www.e-stat.go.jp/stat-search/files?cycle=0&layout=datalist&month=12040606&tclass1=000001117769&tclass2=000001117775&toukei=00200553&tstat=000001095895&year=20160',
            'https://www.e-stat.go.jp/index.php/stat-search/files?cycle=0&layout=datalist&month=12040606&tclass1=000001117769&tclass2=000001117775&toukei=00200553&tstat=000001095895&year=20160',
          ]
          found=[]
          for j,u in enumerate(urls):
            r=s.get(u,timeout=30); print('PAGE',j,r.status_code,len(r.content),r.url)
            pathlib.Path(f'out/page{j}.html').write_bytes(r.content)
            if r.status_code!=200: continue
            soup=BeautifulSoup(r.text,'html.parser')
            for a in soup.find_all('a',href=True):
              h=urljoin(r.url,a['href']); t=' '.join(a.stripped_strings)
              if 'statInfId=' in h or 'file-download' in h or 'EXCEL' in t.upper():
                found.append((t,h))
          # de-dup
          seen=set(); found=[x for x in found if not (x[1] in seen or seen.add(x[1]))]
          pathlib.Path('out/links.tsv').write_text('\n'.join(t+'\t'+u for t,u in found),encoding='utf-8')
          print('LINKS',len(found))
          for t,u in found:
            print('LINK',t[:120],u)
          ids=[]
          for t,u in found:
            m=re.search(r'statInfId=(\d+)',u)
            if m: ids.append(m.group(1))
          print('STATINFIDS',sorted(set(ids)))
          # Probe candidate workbook links from pages. Save any Excel binary >=10KB.
          n=0
          for t,u in found:
            if 'file-download' not in u: continue
            rr=s.get(u,timeout=60,allow_redirects=True)
            sig=rr.content[:8]
            print('FETCH',rr.status_code,len(rr.content),sig,t[:80],u)
            if rr.status_code==200 and len(rr.content)>10000 and (sig.startswith(b'PK') or sig.startswith(bytes.fromhex('D0CF11E0'))):
              p=pathlib.Path(f'out/candidate_{n}.bin'); p.write_bytes(rr.content); n+=1
          print('EXCEL_CANDIDATES',n)
          PY
          sha256sum out/* || true
          file out/* || true
      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: holdout-denominator-discovery
          path: out/
          if-no-files-found: error
          retention-days: 1
