name: Diagnostic Holdout Denominator

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect official 2016 Economic Census table 1
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'xlrd==2.0.1' 'requests==2.32.5'
          mkdir -p out
          python3 - <<'PY'
          import csv, hashlib, re, requests, xlrd
          from pathlib import Path
          url='https://www.e-stat.go.jp/stat-search/file-download?statInfId=000031768938&fileKind=0'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=60); r.raise_for_status()
          Path('out/table1.xls').write_bytes(r.content)
          print('RAW',len(r.content),hashlib.sha256(r.content).hexdigest())
          wb=xlrd.open_workbook(file_contents=r.content)
          print('SHEETS',[(s.name,s.nrows,s.ncols) for s in wb.sheets()])
          targets=['千代田区','中央区','港区','新宿区','文京区','台東区','墨田区','江東区','品川区','目黒区','大田区','世田谷区','渋谷区','中野区','杉並区','豊島区','北区','荒川区','板橋区','練馬区','足立区','葛飾区','江戸川区','福岡市東区','福岡市博多区','福岡市中央区','福岡市南区','福岡市西区','福岡市城南区','福岡市早良区']
          with open('out/matches.tsv','w',encoding='utf-8',newline='') as f:
            w=csv.writer(f,delimiter='\t'); w.writerow(['sheet','row','cells'])
            for sh in wb.sheets():
              for i in range(sh.nrows):
                vals=[sh.cell_value(i,j) for j in range(sh.ncols)]
                text=' | '.join(str(v) for v in vals)
                if any(t in text for t in targets):
                  compact=[]
                  for j,v in enumerate(vals):
                    if v not in ('',None): compact.append(f'{j}:{v}')
                  w.writerow([sh.name,i,' || '.join(compact)])
                  print('MATCH',sh.name,i,' || '.join(compact)[:3000])
          PY
          sha256sum out/*
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: holdout-denominator-inspection
          path: out/
          if-no-files-found: error
          retention-days: 1
