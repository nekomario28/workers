name: Diagnostic Transit Future Corrective Label V2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Apply preexisting-same-name semantic censor without score tuning
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'requests==2.32.5' 'pyshp==2.3.1'
          mkdir -p input out
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/nekomario28/workers/actions/artifacts/9490201891/zip' -o /tmp/v1.zip
          unzip -q /tmp/v1.zip -d input
          python3 - <<'PY'
          import csv, hashlib, io, json, math, unicodedata, zipfile
          from collections import Counter, defaultdict
          from pathlib import Path
          import requests, shapefile

          IN=Path('input/transit_future_strict_2019_2025_pop2015.csv')
          EXPECT='0e85e67fe1ee481cc954ee3bd19c532bcb9718e76fc31041a7101ce451f70f12'
          if hashlib.sha256(IN.read_bytes()).hexdigest()!=EXPECT: raise SystemExit('v1 strict CSV SHA mismatch')
          rows=list(csv.DictReader(IN.open(encoding='utf-8')))
          if len(rows)!=9736: raise SystemExit(f'expected 9736 rows, got {len(rows)}')
          def norm(x): return ''.join(unicodedata.normalize('NFKC',str(x or '')).split())

          u='https://nlftp.mlit.go.jp/ksj/gml/data/N02/N02-19/N02-19_GML.zip'
          q=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=120); q.raise_for_status()
          raw=q.content; raw_sha=hashlib.sha256(raw).hexdigest()
          if raw_sha!='a2ae41ebd42ca43613784e07ac3568d101c5b23fe4ba8194286aeae038247602': raise SystemExit('N02-2019 SHA changed')
          z=zipfile.ZipFile(io.BytesIO(raw)); names=z.namelist()
          shp=next(n for n in names if n.lower().endswith('station.shp'))
          base=shp[:-4]
          fs={e:next(n for n in names if n.lower()==(base+e).lower()) for e in ['.shp','.shx','.dbf']}
          rdr=None; used_enc=None
          for enc in ['cp932','utf-8']:
            try:
              x=shapefile.Reader(shp=io.BytesIO(z.read(fs['.shp'])),shx=io.BytesIO(z.read(fs['.shx'])),dbf=io.BytesIO(z.read(fs['.dbf'])),encoding=enc,encodingErrors='strict')
              if len(x): _=x.record(0)
              rdr=x; used_enc=enc; break
            except Exception: pass
          if rdr is None: raise SystemExit('cannot decode N02-2019 Station')
          fields=[f[0] for f in rdr.fields[1:]]
          names_by_service=defaultdict(set)
          for rec in rdr.iterRecords():
            d=dict(zip(fields,rec)); op=norm(d.get('N02_004')); line=norm(d.get('N02_003')); name=norm(d.get('N02_005'))
            if op and line and name: names_by_service[(op,line)].add(name)

          corrected=[]; changed=[]
          for r in rows:
            x=dict(r); old=r['strict_label_status']; new=old
            if old=='positive':
              service=(norm(r['operator']),norm(r['line']))
              fut=[norm(s) for s in r['strict_positive_station_names'].split('|') if norm(s)]
              collisions=sorted(set(fut)&names_by_service.get(service,set()))
              if collisions:
                new='censored_preexisting_same_name_relocation_or_recode'
                changed.append({'gap_id':r['gap_id'],'operator':r['operator'],'line':r['line'],'station_a':r['station_a'],'station_b':r['station_b'],'future_station_names':r['strict_positive_station_names'],'preexisting_same_names':'|'.join(collisions),'old_status':old,'new_status':new})
            x['strict_label_status_v2_corrective']=new
            corrected.append(x)

          counts=Counter(r['strict_label_status_v2_corrective'] for r in corrected)
          if not changed: raise SystemExit('semantic audit found no collisions; expected at least known cases')
          print('CHANGED_COUNT',len(changed))
          for x in changed: print('CHANGED',json.dumps(x,ensure_ascii=False))
          print('STATUS_V2',json.dumps(dict(counts),ensure_ascii=False))

          evalrows=[r for r in corrected if r['strict_label_status_v2_corrective'] in ('positive','negative') and r['pop3x3_2015']!='' and r['pop500_midpoint_2015']!='']
          y=[1 if r['strict_label_status_v2_corrective']=='positive' else 0 for r in evalrows]; P=sum(y); N=len(y)
          if P<1: raise SystemExit('zero corrected positives')
          def rank01(vals):
            order=sorted(range(len(vals)),key=lambda i:vals[i]); ans=[0.0]*len(vals); i=0; n=len(vals)
            while i<n:
              j=i+1
              while j<n and vals[order[j]]==vals[order[i]]: j+=1
              q=0.5 if n==1 else ((i+j-1)/2)/(n-1)
              for k in range(i,j): ans[order[k]]=q
              i=j
            return ans
          rg=rank01([math.log1p(float(r['gap_length_m'])) for r in evalrows])
          r500=rank01([math.log1p(float(r['pop500_midpoint_2015'])) for r in evalrows])
          r3=rank01([math.log1p(float(r['pop3x3_2015'])) for r in evalrows])
          scores={'gap_only':rg,'pop500_only_diagnostic':r500,'pop3x3_only':r3,'fixed_equal_rank_gap_pop3x3':[0.5*a+0.5*b for a,b in zip(rg,r3)]}
          keys=[(r['operator'],r['line'],r['station_a'],r['station_b']) for r in evalrows]
          def ap_tie(score):
            groups={}
            for s,yy in zip(score,y):
              a=groups.setdefault(s,[0,0]); a[0]+=yy; a[1]+=1
            tp=seen=0; ap=0.
            for s in sorted(groups,reverse=True):
              pos,n=groups[s]; tp+=pos; seen+=n
              if pos: ap+=(pos/P)*(tp/seen)
            return ap
          def top(score,k):
            k=min(k,N); idx=sorted(range(N),key=lambda i:(-score[i],keys[i]))[:k]; h=sum(y[i] for i in idx)
            return {'k':k,'hits':h,'precision':h/k if k else 0.,'recall':h/P}
          metrics={}
          for name,score in scores.items():
            metrics[name]={'average_precision_tie_group':ap_tie(score),'top17':top(score,17),'top50':top(score,50),'top100':top(score,100),'top1pct':top(score,max(1,int(N*.01))),'top5pct':top(score,max(1,int(N*.05)))}
            print('METRIC',name,json.dumps(metrics[name],ensure_ascii=False))

          out=Path('out/transit_future_strict_v2_corrective.csv')
          with out.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=list(corrected[0].keys())); w.writeheader(); w.writerows(corrected)
          cp=Path('out/v2_changed_positive_audit.csv')
          with cp.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=list(changed[0].keys())); w.writeheader(); w.writerows(changed)
          summary={'interpretation':'post-outcome corrective diagnostic only; not confirmatory performance','input_v1_sha256':EXPECT,'n02_2019_sha256':raw_sha,'semantic_rule':'future positive station name already exists anywhere on same cutoff operator+line => censor as relocation/recode; no score/radius/weight changes','changed_positive_count':len(changed),'status_counts':dict(counts),'evaluation_rows':N,'positives':P,'prevalence':P/N,'metrics':metrics,'output_sha256':hashlib.sha256(out.read_bytes()).hexdigest(),'changed_audit_sha256':hashlib.sha256(cp.read_bytes()).hexdigest()}
          sp=Path('out/v2_corrective_summary.json'); sp.write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('GATE',json.dumps(summary,ensure_ascii=False))
          for p in sorted(Path('out').iterdir()): print('SHA',p.name,hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Upload corrective v2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: transit-future-corrective-label-v2
          path: out/
          if-no-files-found: error
          retention-days: 2
