name: Diagnostic Transit Future N02 Snapshot Labels

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Derive physical station additions from annual N02 snapshots
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'requests==2.32.5' 'pyshp==2.3.1'
          mkdir -p out work
          python3 - <<'PY'
          import csv, hashlib, json, math, os, zipfile
          from collections import defaultdict
          from pathlib import Path
          import requests, shapefile

          YEARS=list(range(2011,2023))
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'

          def hav(lat1,lon1,lat2,lon2):
            R=6371000.0
            p1=math.radians(lat1); p2=math.radians(lat2)
            dp=math.radians(lat2-lat1); dl=math.radians(lon2-lon1)
            a=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
            return 2*R*math.asin(min(1,math.sqrt(a)))

          def point_seg_m(lat,lon,lat1,lon1,lat2,lon2):
            # Local equirectangular approximation; adequate for <= several km station/rail proximity.
            lat0=math.radians((lat+lat1+lat2)/3)
            sx=111320.0*math.cos(lat0); sy=110540.0
            px=lon*sx; py=lat*sy; ax=lon1*sx; ay=lat1*sy; bx=lon2*sx; by=lat2*sy
            vx=bx-ax; vy=by-ay; wx=px-ax; wy=py-ay
            vv=vx*vx+vy*vy
            if vv==0: return math.hypot(px-ax,py-ay)
            t=max(0,min(1,(wx*vx+wy*vy)/vv)); qx=ax+t*vx; qy=ay+t*vy
            return math.hypot(px-qx,py-qy)

          def archive_url(y):
            yy=str(y)[-2:]
            fn=f'N02-{yy}.zip' if y==2013 else f'N02-{yy}_GML.zip'
            return f'https://nlftp.mlit.go.jp/ksj/gml/data/N02/N02-{yy}/{fn}'

          raw_meta={}; snapshots={}
          for y in YEARS:
            u=archive_url(y); r=s.get(u,timeout=120)
            print('FETCH',y,r.status_code,len(r.content),u)
            if r.status_code!=200 or r.content[:2]!=b'PK': raise SystemExit(f'N02 {y} fetch failed')
            sha=hashlib.sha256(r.content).hexdigest(); raw_meta[y]={'url':u,'sha256':sha,'bytes':len(r.content)}
            zp=Path(f'work/n02-{y}.zip'); zp.write_bytes(r.content); z=zipfile.ZipFile(zp)
            names=z.namelist()
            station=[n for n in names if n.lower().endswith('.shp') and 'station' in os.path.basename(n).lower()]
            rail=[n for n in names if n.lower().endswith('.shp') and 'railroadsection' in os.path.basename(n).lower()]
            if not station or not rail: raise SystemExit(f'{y} missing Station/RailroadSection shp: {names[:20]}')
            def extract_family(shp_name,prefix):
              stem=shp_name[:-4]
              for ext in ['.shp','.shx','.dbf','.prj','.cpg']:
                n=stem+ext
                if n in names: Path(f'work/{prefix}{ext}').write_bytes(z.read(n))
            sp=f'station-{y}'; rp=f'rail-{y}'; extract_family(station[0],sp); extract_family(rail[0],rp)
            sr=shapefile.Reader(f'work/{sp}.shp',encoding='cp932',encodingErrors='replace')
            sf=[f[0] for f in sr.fields[1:]]
            if 'N02_005' not in sf: raise SystemExit(f'{y} station schema mismatch {sf}')
            stations=[]
            for rec in sr.iterShapeRecords():
              a=dict(zip(sf,rec.record)); pts=rec.shape.points
              if not pts: continue
              lon=sum(p[0] for p in pts)/len(pts); lat=sum(p[1] for p in pts)/len(pts)
              stations.append({'name':str(a.get('N02_005') or '').strip(),'route':str(a.get('N02_003') or '').strip(),'operator':str(a.get('N02_004') or '').strip(),'lon':lon,'lat':lat})
            # Collapse duplicate route records with near-identical centroids.
            route_unique={}
            for x in stations:
              k=(x['name'],x['route'],x['operator'],round(x['lon'],4),round(x['lat'],4)); route_unique[k]=x
            stations=list(route_unique.values())
            # Physical cluster: same name within ~300m; start from route records. Name-based collapse only within a snapshot.
            physical=[]
            for x in stations:
              hit=None
              for p in physical:
                if p['name']==x['name'] and hav(p['lat'],p['lon'],x['lat'],x['lon'])<=300:
                  hit=p; break
              if hit:
                n=hit['n']; hit['lon']=(hit['lon']*n+x['lon'])/(n+1); hit['lat']=(hit['lat']*n+x['lat'])/(n+1); hit['n']+=1
                hit['routes'].add(x['route']); hit['operators'].add(x['operator'])
              else: physical.append({'name':x['name'],'lon':x['lon'],'lat':x['lat'],'n':1,'routes':{x['route']},'operators':{x['operator']}})
            rr=shapefile.Reader(f'work/{rp}.shp',encoding='cp932',encodingErrors='replace')
            rail_segments=[]
            for shape in rr.shapes():
              pts=shape.points
              for i in range(len(pts)-1):
                a,b=pts[i],pts[i+1]; rail_segments.append((a[1],a[0],b[1],b[0]))
            snapshots[y]={'route_stations':stations,'physical':physical,'rail_segments':rail_segments,'station_fields':sf}
            print('SNAPSHOT',y,'route_records',len(stations),'physical',len(physical),'rail_segments',len(rail_segments),'fields',sf)

          def bucket_points(xs,step=.01):
            b=defaultdict(list)
            for x in xs: b[(math.floor(x['lat']/step),math.floor(x['lon']/step))].append(x)
            return b
          def nearest_prior_station(x,b,step=.01):
            iy=math.floor(x['lat']/step); ix=math.floor(x['lon']/step); best=None
            for dy in range(-1,2):
              for dx in range(-1,2):
                for p in b.get((iy+dy,ix+dx),[]):
                  d=hav(x['lat'],x['lon'],p['lat'],p['lon'])
                  if best is None or d<best[0]: best=(d,p)
            return best
          def rail_bucket(segs,step=.02):
            b=defaultdict(list)
            for seg in segs:
              lat1,lon1,lat2,lon2=seg
              ymin=math.floor(min(lat1,lat2)/step); ymax=math.floor(max(lat1,lat2)/step)
              xmin=math.floor(min(lon1,lon2)/step); xmax=math.floor(max(lon1,lon2)/step)
              for iy in range(ymin,ymax+1):
                for ix in range(xmin,xmax+1): b[(iy,ix)].append(seg)
            return b
          def nearest_rail_m(x,b,step=.02):
            iy=math.floor(x['lat']/step); ix=math.floor(x['lon']/step); best=None
            for radius in [0,1,2]:
              for dy in range(-radius,radius+1):
                for dx in range(-radius,radius+1):
                  for seg in b.get((iy+dy,ix+dx),[]):
                    d=point_seg_m(x['lat'],x['lon'],*seg)
                    if best is None or d<best: best=d
              if best is not None and best<5000: break
            return best

          additions=[]; yearly=[]
          for y in YEARS[1:]:
            prev=snapshots[y-1]; cur=snapshots[y]
            pb=bucket_points(prev['physical']); rb=rail_bucket(prev['rail_segments'])
            rows=[]
            for x in cur['physical']:
              near=nearest_prior_station(x,pb); d_station=near[0] if near else None
              if d_station is not None and d_station<=500: continue  # same physical station location; includes renames.
              d_rail=nearest_rail_m(x,rb)
              cls='infill_like' if d_rail is not None and d_rail<=200 else 'new_line_or_extension_like'
              row={'snapshot_year':y,'station_name':x['name'],'latitude':x['lat'],'longitude':x['lon'],
                   'routes':' | '.join(sorted(r for r in x['routes'] if r)),'operators':' | '.join(sorted(o for o in x['operators'] if o)),
                   'nearest_prior_station_m':round(d_station,1) if d_station is not None else '',
                   'nearest_prior_rail_m':round(d_rail,1) if d_rail is not None else '',
                   'first_pass_class':cls}
              rows.append(row); additions.append(row)
            c=defaultdict(int)
            for r in rows: c[r['first_pass_class']]+=1
            yearly.append({'year':y,'additions':len(rows),'infill_like':c['infill_like'],'new_line_or_extension_like':c['new_line_or_extension_like']})
            print('YEAR',y,'ADDITIONS',len(rows),'INFILL',c['infill_like'],'NEWLINE',c['new_line_or_extension_like'])
            for r in rows[:25]: print('ADD',r)

          with open('out/n02_station_additions_2012_2022.csv','w',encoding='utf-8',newline='') as f:
            cols=['snapshot_year','station_name','latitude','longitude','routes','operators','nearest_prior_station_m','nearest_prior_rail_m','first_pass_class']
            w=csv.DictWriter(f,fieldnames=cols); w.writeheader(); w.writerows(additions)
          with open('out/n02_addition_counts_by_year.csv','w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=['year','additions','infill_like','new_line_or_extension_like']); w.writeheader(); w.writerows(yearly)
          Path('out/raw_sources.json').write_text(json.dumps(raw_meta,ensure_ascii=False,indent=2),encoding='utf-8')
          meta={
            'method':'annual N02 snapshot physical-location differencing',
            'same_station_match_radius_m':500,'physical_cluster_same_name_radius_m':300,'infill_prior_rail_radius_m':200,
            'license':'official N02 page: 2020+ open data/CC BY 4.0; pre-2020 commercial use permitted',
            'important':'snapshot year is detection year, not exact opening date. New-location labels require audit for relocations and geometry corrections before model evaluation.',
            'total_additions':len(additions),'years':yearly}
          Path('out/meta.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          # Fail on implausibly huge annual deltas: this normally indicates schema/geocoding incompatibility, not real openings.
          bad=[r for r in yearly if r['additions']>120]
          if bad: raise SystemExit(f'implausible snapshot delta, audit required: {bad}')
          assert len(additions)>0
          print('GATE total_additions',len(additions),'annual_max',max(r['additions'] for r in yearly))
          PY
          sha256sum out/*
      - name: Upload N02 snapshot label evidence
        uses: actions/upload-artifact@v4
        with:
          name: transit-future-n02-snapshot-labels
          path: out/
          if-no-files-found: error
          retention-days: 2
