name: Diagnostic Transit Future Census Mesh CSV Inspect

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect official e-Stat 2015 500m mesh CSV files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'requests==2.32.5'
          mkdir -p out
          python3 - <<'PY'
          import csv,hashlib,io,requests
          from pathlib import Path
          BASE='https://www.e-stat.go.jp/gis/statmap-search/data'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.e-stat.go.jp/gis/statmap-search'})
          for code in ['5339','5030']:
            u=BASE; r=s.get(u,params={'statsId':'T000847','code':code,'downloadType':'2'},timeout=90,allow_redirects=True)
            print('FETCH',code,r.status_code,len(r.content),r.url,r.headers.get('content-type'),r.headers.get('content-disposition'))
            r.raise_for_status(); Path(f'out/{code}.bin').write_bytes(r.content)
            print('SHA',code,hashlib.sha256(r.content).hexdigest(),'SIG',r.content[:16])
            # CSV endpoint may return raw CSV or a ZIP; inspect both.
            data=r.content
            if data[:2]==b'PK':
              import zipfile
              z=zipfile.ZipFile(io.BytesIO(data)); print('ZIP',code,z.namelist())
              for n in z.namelist():
                b=z.read(n); Path(f'out/{code}_{Path(n).name}').write_bytes(b)
                print('ZIPFILE',code,n,len(b),hashlib.sha256(b).hexdigest(),b[:20])
                if n.lower().endswith(('.csv','.txt')): data=b; break
            # Try common Japanese encodings and print first 8 parsed rows.
            for enc in ['cp932','shift_jis','utf-8-sig','utf-8']:
              try:
                text=data.decode(enc); print('ENCODING',code,enc); break
              except Exception: pass
            else: raise SystemExit(f'cannot decode {code}')
            Path(f'out/{code}_decoded.txt').write_text(text,encoding='utf-8')
            rd=csv.reader(io.StringIO(text))
            for i,row in zip(range(10),rd): print('ROW',code,i,row[:80])
          PY
          sha256sum out/*
      - name: Upload CSV inspection
        uses: actions/upload-artifact@v4
        with:
          name: transit-future-census-mesh-csv-inspect
          path: out/
          if-no-files-found: error
          retention-days: 2
