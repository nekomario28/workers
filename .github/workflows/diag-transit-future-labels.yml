name: Diagnostic Transit Future Census Mesh JS Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect official e-Stat GIS download JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import re, requests
          from pathlib import Path
          base='https://www.e-stat.go.jp'
          urls=[
            base+'/modules/custom/gis_download/js/gis_download-main.js',
            base+'/modules/custom/gis_download/js/gis_download.js',
          ]
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          for i,u in enumerate(urls):
            r=s.get(u,timeout=60); print('JS',i,r.status_code,len(r.content),r.url)
            if r.status_code==200: Path(f'out/js{i}.js').write_bytes(r.content)
          text='\n'.join(p.read_text(encoding='utf-8',errors='replace') for p in Path('out').glob('*.js'))
          pats=[]
          for pat in [r'url\s*:\s*["\']([^"\']+)',r'ajax\s*\([^)]*',r'fetch\s*\([^)]*',r'/(?:gis|modules)/[^"\'\s)]+',r'[^"\']*(?:download|mesh|statmap)[^"\']*']:
            try:pats.extend(re.findall(pat,text,re.I))
            except Exception as e:print('REGEX_ERR',pat,e)
          # Also print lines with AJAX/data-loading keywords.
          lines=[]
          for n,line in enumerate(text.splitlines(),1):
            if any(k in line.lower() for k in ['ajax','download','mesh','statsid','serveyid','statmap-search','drupalsettings']): lines.append(f'{n}: {line}')
          Path('out/relevant_lines.txt').write_text('\n'.join(lines),encoding='utf-8')
          print('RELEVANT_LINES',len(lines))
          for x in lines[:500]: print(x[:4000])
          PY
          sha256sum out/*
      - name: Upload JS audit
        uses: actions/upload-artifact@v4
        with:
          name: transit-future-census-mesh-js-audit
          path: out/
          if-no-files-found: error
          retention-days: 2
