name: Diagnostic Transit Future Census Mesh Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover official e-Stat 2015 500m mesh download transport
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'requests==2.32.5' 'beautifulsoup4==4.13.4'
          mkdir -p out input
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/nekomario28/workers/actions/artifacts/9488732799/zip' -o /tmp/labels.zip
          unzip -q /tmp/labels.zip -d input
          python3 - <<'PY'
          import csv, json, re, requests
          from pathlib import Path
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          labels=list(csv.DictReader(open('input/transit_future_gap_labels_2020_2025_v1.csv',encoding='utf-8')))
          print('LABELS',len(labels),'POS',sum(r['label_status_v1']=='positive' for r in labels))
          urls=[
            'https://www.e-stat.go.jp/gis/statmap-search?page=1&type=1&toukeiCode=00200521&toukeiYear=2015&aggregateUnit=H&serveyId=H002005112015&statsId=T000847',
            'https://www.e-stat.go.jp/gis/statmap-search?page=1&type=1&toukeiCode=00200521&toukeiYear=2015&aggregateUnit=H&serveyId=H002005112015&statsId=T000847&prefCode=27',
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'ja,en;q=0.8'})
          all_links=[]
          for i,u in enumerate(urls):
            r=s.get(u,timeout=60); print('PAGE',i,r.status_code,len(r.content),r.url); r.raise_for_status(); Path(f'out/page{i}.html').write_bytes(r.content)
            soup=BeautifulSoup(r.text,'html.parser')
            for a in soup.find_all('a',href=True):
              h=urljoin(r.url,a['href']); t=' '.join(a.stripped_strings)
              if any(k in h.lower() for k in ['download','statmap','mesh','stats']) or any(k in t for k in ['ダウンロード','500m','人口']): all_links.append((i,t,h))
            for tag in soup.find_all(True):
              for k,v in tag.attrs.items():
                vv=' '.join(v) if isinstance(v,list) else str(v)
                if any(x in vv.lower() for x in ['download','t000847','h002005112015']): all_links.append((i,f'ATTR {tag.name} {k}',vv))
          seen=set(); uniq=[]
          for x in all_links:
            if x not in seen:seen.add(x);uniq.append(x)
          Path('out/links.tsv').write_text('\n'.join('\t'.join(map(str,x)) for x in uniq),encoding='utf-8')
          print('LINKS',len(uniq))
          for x in uniq[:300]:print('LINK',x)
          # extract likely endpoint strings from raw HTML/scripts
          text='\n'.join(Path(f'out/page{i}.html').read_text(encoding='utf-8',errors='replace') for i in range(len(urls)))
          pats=sorted(set(re.findall(r'''["']([^"']*(?:download|statmap|statsData|mesh)[^"']*)["']''',text,re.I)))
          Path('out/candidate_strings.txt').write_text('\n'.join(pats),encoding='utf-8')
          print('CANDIDATE_STRINGS',len(pats))
          for p in pats[:300]:print('STR',p[:1000])
          PY
          sha256sum out/*
      - name: Upload census mesh transport evidence
        uses: actions/upload-artifact@v4
        with:
          name: transit-future-census-mesh-probe
          path: out/
          if-no-files-found: error
          retention-days: 2
