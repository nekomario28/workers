name: age-growth-fresh-source-freeze

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download exact historical artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/demand /tmp/denom /tmp/out
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nekomario28/workers/actions/artifacts/9481762001/zip \
            -o /tmp/demand.zip
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nekomario28/workers/actions/artifacts/9480653606/zip \
            -o /tmp/denom.zip
          unzip -q /tmp/demand.zip -d /tmp/demand
          unzip -q /tmp/denom.zip -d /tmp/denom
          echo '481c335fe5e5458c7751aec403c289e55cfeb3d0e2a81cc789eb043c00a21c0b  /tmp/demand/2020_age.xls' | sha256sum -c -
          echo 'af485797942888ae6d6b6bc0d1777e791e8715cba5d83c3b117cec0fc6eac394  /tmp/demand/2021_age.xlsx' | sha256sum -c -
          echo '73249e927cf4363b375b2fbdafc6d5c2466c566998cba4844b3c5b505c6cd35b  /tmp/denom/table1.xls' | sha256sum -c -

      - name: Install legacy XLS reader
        run: python -m pip install --disable-pip-version-check xlrd==2.0.2

      - name: Freeze age-growth predictor and 2016 denominator
        run: python scripts/age_growth_fresh_source_freeze.py

      - name: Upload fresh source freeze
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: age-growth-fresh-source-freeze
          path: /tmp/out/
          if-no-files-found: error
          retention-days: 2
