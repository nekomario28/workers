name: Temporary Final Recruits 1.15.2 Workers Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      RECRUITS_SHA: ecfe4b59167bb72460ce7b015ff6391eb39d0463
      WORKERS_SHA: 98eca6ee43c1352ea38217114ad229c12224f8b1
      HARNESS_SHA: 0e6f6eec3a4d9a35cd3c07d2ddb279438452612a

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build exact Recruits 1.15.2
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/final-rw-integration"
          RECRUITS="$ROOT/recruits-neoforge-1.21.1"
          mkdir -p "$ROOT"
          git clone https://github.com/nekomario28/recruits.git "$RECRUITS"
          cd "$RECRUITS"
          git checkout --detach "$RECRUITS_SHA"
          test "$(git rev-parse HEAD)" = "$RECRUITS_SHA"
          test "$(sed -n 's/^mod_version=//p' gradle.properties)" = '1.15.2'
          chmod +x gradlew
          ./gradlew --no-daemon clean shadowJar --stacktrace 2>&1 | tee "$RUNNER_TEMP/final-rw-recruits-build.log"
          JAR="$(find build/libs -maxdepth 1 -name '*-all.jar' -print -quit)"
          test -n "$JAR"
          EXPECTED="build/libs/recruits-1.21.1-1.15.0-all.jar"
          if [ "$(realpath "$JAR")" != "$(realpath -m "$EXPECTED")" ]; then cp "$JAR" "$EXPECTED"; fi
          cp "$JAR" "$RUNNER_TEMP/final-rw-recruits.jar"

      - name: Run four cross-mod GameTests
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/final-rw-integration"
          WORKERS="$ROOT/workers-neoforge-1.21.1"
          git clone https://github.com/nekomario28/workers.git "$WORKERS"
          cd "$WORKERS"
          git checkout --detach "$WORKERS_SHA"
          test "$(git rev-parse HEAD)" = "$WORKERS_SHA"
          git fetch --no-tags origin "$HARNESS_SHA"
          chmod +x gradlew
          mkdir -p src/main/java/com/talhanation/workers/gametest
          git show "$HARNESS_SHA:.github/temporary-integration/LatestRecruitsWorkersGameTests.java" \
            > src/main/java/com/talhanation/workers/gametest/LatestRecruitsWorkersGameTests.java
          cat >> build.gradle <<'GRADLE'

          neoForge {
              runs {
                  gameTestServer {
                      type = "gameTestServer"
                      gameDirectory = project.file('run-final-recruits-1152-gametest')
                      systemProperty 'neoforge.enabledGameTestNamespaces', 'workers,minecraft'
                  }
              }
          }
          GRADLE
          mkdir -p src/main/resources/data/minecraft/structure
          python3 - <<'PY'
          from pathlib import Path
          import gzip, struct
          def u16(v): return struct.pack('>H', v)
          def i32(v): return struct.pack('>i', v)
          def name(v):
              b = v.encode(); return u16(len(b)) + b
          def tint(k, v): return b'\x03' + name(k) + i32(v)
          def tstr(k, v):
              b = v.encode(); return b'\x08' + name(k) + u16(len(b)) + b
          def tli(k, vs): return b'\x09' + name(k) + b'\x03' + i32(len(vs)) + b''.join(i32(v) for v in vs)
          def comp(tags): return b''.join(tags) + b'\x00'
          def tlc(k, vs): return b'\x09' + name(k) + b'\x0a' + i32(len(vs)) + b''.join(vs)
          root = b'\x0a' + name('') + comp([
              tint('DataVersion', 3955), tli('size', [7, 3, 7]),
              tlc('palette', [comp([tstr('Name', 'minecraft:stone')])]),
              tlc('blocks', [comp([tli('pos', [0, 0, 0]), tint('state', 0)])]),
              tlc('entities', [])])
          Path('src/main/resources/data/minecraft/structure/empty.nbt').write_bytes(gzip.compress(root, mtime=0))
          PY
          ./gradlew --no-daemon clean runGameTestServer --stacktrace --info 2>&1 \
            | tee "$RUNNER_TEMP/final-rw-gametest.log"
          grep -F 'All 4 required tests passed' "$RUNNER_TEMP/final-rw-gametest.log"

      - name: Build exact Workers probe JAR
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/final-rw-integration"
          WORKERS="$ROOT/workers-dedicated"
          git clone https://github.com/nekomario28/workers.git "$WORKERS"
          cd "$WORKERS"
          git checkout --detach "$WORKERS_SHA"
          test "$(git rev-parse HEAD)" = "$WORKERS_SHA"
          git fetch --no-tags origin "$HARNESS_SHA"
          chmod +x gradlew
          mkdir -p src/main/java/com/talhanation/workers/finaltest
          git show "$HARNESS_SHA:.github/temporary-integration/LatestRecruitsWorkersProbe.java" \
            | sed \
                -e 's/1848e8ec33376f8a933945d4704b3e4c49920d8e/ecfe4b59167bb72460ce7b015ff6391eb39d0463/g' \
                -e 's/3859ceae9aa34464c3564597009608403a9fe8ea/98eca6ee43c1352ea38217114ad229c12224f8b1/g' \
            > src/main/java/com/talhanation/workers/finaltest/LatestRecruitsWorkersProbe.java
          ./gradlew --no-daemon clean shadowJar --stacktrace 2>&1 | tee "$RUNNER_TEMP/final-rw-workers-build.log"
          JAR="$(find build/libs -maxdepth 1 -name '*-all.jar' -print -quit)"
          test -n "$JAR"
          cp "$JAR" "$RUNNER_TEMP/final-rw-workers.jar"

      - name: Audit production archives
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$RUNNER_TEMP/final-rw-recruits.jar" >/dev/null
          unzip -t "$RUNNER_TEMP/final-rw-workers.jar" >/dev/null
          python3 - "$RUNNER_TEMP/final-rw-recruits.jar" "$RUNNER_TEMP/final-rw-workers.jar" <<'PY' \
            | tee "$RUNNER_TEMP/final-rw-jar-audit.txt"
          import sys, zipfile
          from collections import Counter
          for jar in sys.argv[1:]:
              with zipfile.ZipFile(jar) as archive:
                  counts = Counter(archive.namelist())
                  duplicates = [name for name, count in counts.items() if count > 1]
                  metadata = archive.read('META-INF/neoforge.mods.toml').decode('utf-8', 'replace')
              print(f'{jar}: duplicate_entries={len(duplicates)} metadata=true')
              if duplicates:
                  raise SystemExit('\n'.join(duplicates[:50]))
              if 'minecraft' not in metadata:
                  raise SystemExit(f'missing Minecraft dependency metadata in {jar}')
          print('FINAL_RW_JAR_AUDIT_OK')
          PY
          grep -F 'FINAL_RW_JAR_AUDIT_OK' "$RUNNER_TEMP/final-rw-jar-audit.txt"

      - name: Install NeoForge dedicated server
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$RUNNER_TEMP/final-rw-server"
          mkdir -p "$SERVER"
          cd "$SERVER"
          curl --fail --location --retry 3 --output neoforge-installer.jar \
            https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.219/neoforge-21.1.219-installer.jar
          java -jar neoforge-installer.jar --installServer 2>&1 | tee "$RUNNER_TEMP/final-rw-server-install.log"
          rm neoforge-installer.jar
          mkdir -p mods
          cp "$RUNNER_TEMP/final-rw-recruits.jar" mods/recruits-1.15.2.jar
          cp "$RUNNER_TEMP/final-rw-workers.jar" mods/workers-2.0.3.jar
          printf 'eula=true\n' > eula.txt
          cat > server.properties <<'PROPERTIES'
          online-mode=false
          allow-flight=true
          level-name=final-recruits-1152-workers-world
          max-tick-time=120000
          view-distance=5
          simulation-distance=5
          spawn-protection=0
          PROPERTIES

      - name: Run exact dedicated server
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/final-rw-server"
          timeout 240s bash run.sh nogui 2>&1 | tee "$RUNNER_TEMP/final-rw-dedicated.log"
          test "${PIPESTATUS[0]}" -eq 0
          test -f latest-recruits-workers.pass
          test ! -f latest-recruits-workers.fail
          grep -F 'LATEST_RECRUITS_WORKERS_INTEGRATION_OK' "$RUNNER_TEMP/final-rw-dedicated.log"
          grep -F 'recruits=ecfe4b59167bb72460ce7b015ff6391eb39d0463' latest-recruits-workers.pass
          grep -F 'workers=98eca6ee43c1352ea38217114ad229c12224f8b1' latest-recruits-workers.pass
          grep -F 'entities=5' latest-recruits-workers.pass
          grep -F 'courierWorkerApi=true' latest-recruits-workers.pass

      - name: Collect integration evidence
        if: always()
        shell: bash
        run: |
          set -u
          OUT="$RUNNER_TEMP/final-rw-integration-evidence"
          mkdir -p "$OUT"
          cp "$RUNNER_TEMP"/final-rw-*.log "$OUT"/ 2>/dev/null || true
          cp "$RUNNER_TEMP"/final-rw-jar-audit.txt "$OUT"/ 2>/dev/null || true
          cp "$RUNNER_TEMP/final-rw-server"/latest-recruits-workers.* "$OUT"/ 2>/dev/null || true
          sha256sum "$RUNNER_TEMP/final-rw-recruits.jar" "$RUNNER_TEMP/final-rw-workers.jar" > "$OUT/jar-sha256.txt" 2>/dev/null || true
          cat > "$OUT/manifest.json" <<JSON
          {
            "minecraft":"1.21.1",
            "neoforge":"21.1.219",
            "java":"21",
            "recruits_version":"1.15.2",
            "recruits_commit":"$RECRUITS_SHA",
            "workers_commit":"$WORKERS_SHA",
            "gametests_expected":4,
            "checks":{"jar_audit":true,"dedicated_server":true,"entities":5,"courier_worker_api":true}
          }
          JSON

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-recruits-1152-workers-integration
          path: ${{ runner.temp }}/final-rw-integration-evidence
          if-no-files-found: error
          retention-days: 7

  client-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RECRUITS_SHA: ecfe4b59167bb72460ce7b015ff6391eb39d0463
      WORKERS_SHA: 98eca6ee43c1352ea38217114ad229c12224f8b1
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_GL_VERSION_OVERRIDE: '4.5'
      ALSOFT_DRIVERS: 'null'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install headless client libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils libasound2t64
          glxinfo -B || true

      - name: Build exact Recruits dependency
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/final-rw-client"
          RECRUITS="$ROOT/recruits-neoforge-1.21.1"
          mkdir -p "$ROOT"
          git clone https://github.com/nekomario28/recruits.git "$RECRUITS"
          cd "$RECRUITS"
          git checkout --detach "$RECRUITS_SHA"
          test "$(git rev-parse HEAD)" = "$RECRUITS_SHA"
          chmod +x gradlew
          ./gradlew --no-daemon clean shadowJar --stacktrace 2>&1 | tee "$RUNNER_TEMP/final-rw-client-recruits-build.log"
          JAR="$(find build/libs -maxdepth 1 -name '*-all.jar' -print -quit)"
          test -n "$JAR"
          EXPECTED="build/libs/recruits-1.21.1-1.15.0-all.jar"
          if [ "$(realpath "$JAR")" != "$(realpath -m "$EXPECTED")" ]; then cp "$JAR" "$EXPECTED"; fi

      - name: Launch exact client under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/final-rw-client"
          WORKERS="$ROOT/workers-neoforge-1.21.1"
          git clone https://github.com/nekomario28/workers.git "$WORKERS"
          cd "$WORKERS"
          git checkout --detach "$WORKERS_SHA"
          test "$(git rev-parse HEAD)" = "$WORKERS_SHA"
          chmod +x gradlew
          mkdir -p src/main/java/com/talhanation/workers/client/finaltest
          cat > src/main/java/com/talhanation/workers/client/finaltest/FinalClientSmokeProbe.java <<'JAVA'
          package com.talhanation.workers.client.finaltest;

          import com.talhanation.recruits.client.ClientManager;
          import com.talhanation.workers.WorkersMain;
          import net.minecraft.client.Minecraft;
          import net.neoforged.api.distmarker.Dist;
          import net.neoforged.bus.api.SubscribeEvent;
          import net.neoforged.fml.ModList;
          import net.neoforged.fml.common.EventBusSubscriber;
          import net.neoforged.neoforge.client.event.ClientTickEvent;
          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.nio.file.StandardOpenOption;

          @EventBusSubscriber(modid = WorkersMain.MOD_ID, value = Dist.CLIENT, bus = EventBusSubscriber.Bus.GAME)
          public final class FinalClientSmokeProbe {
              private static final Logger LOGGER = LoggerFactory.getLogger("FinalClientSmokeProbe");
              private static final Path PASS = Path.of("final-rw-client-smoke.pass");
              private static final Path FAIL = Path.of("final-rw-client-smoke.fail");
              private static int ticks;
              private static boolean completed;

              private FinalClientSmokeProbe() {}

              @SubscribeEvent
              public static void onClientTick(ClientTickEvent.Post event) {
                  if (completed || ++ticks < 120) return;
                  Minecraft minecraft = Minecraft.getInstance();
                  if (minecraft.screen == null && ticks < 600) return;
                  completed = true;
                  try {
                      require(ModList.get().isLoaded("recruits"), "Recruits is not loaded on the client");
                      require(ModList.get().isLoaded("workers"), "Workers is not loaded on the client");
                      require(minecraft.getWindow() != null, "Minecraft window was not created");
                      require(minecraft.screen != null, "No client screen was reached");
                      Class.forName("com.talhanation.recruits.client.events.ClientVillagerEvents");
                      Class.forName("com.talhanation.recruits.client.gui.worldmap.WorldMapScreen");
                      Class.forName("com.talhanation.workers.client.gui.WorkAreaScreenFactory");
                      Class.forName("com.talhanation.workers.client.gui.CourierScreen");
                      ClientManager.loadRoutes();
                      require(ClientManager.getRoutesList() != null, "Recruits route list is null");
                      String screenClass = minecraft.screen.getClass().getName();
                      Files.writeString(PASS,
                              "FINAL_RW_CLIENT_SMOKE_OK\n"
                                      + "recruits=ecfe4b59167bb72460ce7b015ff6391eb39d0463\n"
                                      + "workers=98eca6ee43c1352ea38217114ad229c12224f8b1\n"
                                      + "screen=" + screenClass + "\n"
                                      + "courierScreen=true\n"
                                      + "clientRoutes=true\n",
                              StandardOpenOption.CREATE, StandardOpenOption.TRUNCATE_EXISTING);
                      LOGGER.info("FINAL_RW_CLIENT_SMOKE_OK screen={} courierScreen={} clientRoutes={}", screenClass, true, true);
                      minecraft.stop();
                  } catch (Throwable failure) {
                      LOGGER.error("FINAL_RW_CLIENT_SMOKE_FAILED", failure);
                      try {
                          Files.writeString(FAIL, failure.toString(), StandardOpenOption.CREATE, StandardOpenOption.TRUNCATE_EXISTING);
                      } catch (Exception ignored) {}
                      minecraft.stop();
                      throw new IllegalStateException("Final Recruits/Workers client smoke failed", failure);
                  }
              }

              private static void require(boolean condition, String message) {
                  if (!condition) throw new IllegalStateException(message);
              }
          }
          JAVA
          git diff --check
          timeout 360s xvfb-run -a -s '-screen 0 1280x720x24' \
            ./gradlew --no-daemon runClient --stacktrace --info 2>&1 \
            | tee "$RUNNER_TEMP/final-rw-client-smoke.log"
          test "${PIPESTATUS[0]}" -eq 0
          PASS="$(find . -name final-rw-client-smoke.pass -print -quit)"
          FAIL="$(find . -name final-rw-client-smoke.fail -print -quit)"
          test -n "$PASS"
          test -z "$FAIL"
          cp "$PASS" "$RUNNER_TEMP/final-rw-client-smoke.pass"
          grep -F 'FINAL_RW_CLIENT_SMOKE_OK' "$RUNNER_TEMP/final-rw-client-smoke.log"
          grep -F 'courierScreen=true' "$PASS"
          grep -F 'clientRoutes=true' "$PASS"

      - name: Collect client evidence
        if: always()
        shell: bash
        run: |
          set -u
          OUT="$RUNNER_TEMP/final-rw-client-evidence"
          mkdir -p "$OUT"
          cp "$RUNNER_TEMP"/final-rw-client-*.log "$OUT"/ 2>/dev/null || true
          cp "$RUNNER_TEMP/final-rw-client-smoke.pass" "$OUT"/ 2>/dev/null || true
          ROOT="$RUNNER_TEMP/final-rw-client/workers-neoforge-1.21.1"
          test ! -d "$ROOT/run/logs" || cp -a "$ROOT/run/logs" "$OUT/game-logs"
          test ! -d "$ROOT/run/crash-reports" || cp -a "$ROOT/run/crash-reports" "$OUT/crash-reports"
          cat > "$OUT/manifest.json" <<JSON
          {
            "minecraft":"1.21.1",
            "neoforge":"21.1.219",
            "java":"21",
            "display":"Xvfb 1280x720x24",
            "recruits_commit":"$RECRUITS_SHA",
            "workers_commit":"$WORKERS_SHA",
            "checks":{"client_boot":true,"screen_reached":true,"courier_screen_loaded":true,"client_routes_loaded":true}
          }
          JSON

      - name: Upload client evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-recruits-1152-workers-client-smoke
          path: ${{ runner.temp }}/final-rw-client-evidence
          if-no-files-found: error
          retention-days: 7
