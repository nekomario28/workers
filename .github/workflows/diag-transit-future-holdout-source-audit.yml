name: Diagnostic Transit Future 2014 Gap Universe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Build preregistered N02-2014 same-service adjacent station-gap universe
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'requests==2.32.5' 'pyshp==2.3.1'
          mkdir -p out
          python3 - <<'PY'
          import csv, hashlib, heapq, io, json, math, unicodedata, zipfile
          from collections import defaultdict
          from pathlib import Path
          import requests, shapefile

          YEAR=2014
          URL='https://nlftp.mlit.go.jp/ksj/gml/data/N02/N02-14/N02-14_GML.zip'
          EXPECT_SHA='a8a6dd8b00bb175ca89cd0ac542312b3726cbd81ced06a1d85ae0a6098e56204'
          SPECIAL={'大船渡線','気仙沼線'}
          SNAP=5
          def norm(x): return ''.join(unicodedata.normalize('NFKC',str(x or '')).split())
          def hav(lat1,lon1,lat2,lon2):
            R=6371000.; p1=math.radians(lat1); p2=math.radians(lat2); dp=math.radians(lat2-lat1); dl=math.radians(lon2-lon1)
            a=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
            return 2*R*math.asin(min(1,math.sqrt(a)))
          def parts(shape):
            pts=shape.points; starts=list(shape.parts)+[len(pts)]
            return [pts[starts[i]:starts[i+1]] for i in range(len(starts)-1) if starts[i+1]-starts[i]>=1]
          def centroid(shape):
            pts=shape.points
            return (sum(p[1] for p in pts)/len(pts),sum(p[0] for p in pts)/len(pts)) if pts else (None,None)
          def node(p): return (round(p[0],SNAP),round(p[1],SNAP))

          q=requests.get(URL,headers={'User-Agent':'Mozilla/5.0'},timeout=120); q.raise_for_status(); assert q.content[:2]==b'PK'
          raw_sha=hashlib.sha256(q.content).hexdigest()
          if raw_sha!=EXPECT_SHA: raise SystemExit(f'N02-2014 SHA mismatch {raw_sha}')
          z=zipfile.ZipFile(io.BytesIO(q.content)); names=z.namelist()
          def shp_reader(token):
            cands=sorted([n for n in names if n.lower().endswith(token.lower()+'.shp')],key=lambda n:(0 if '/utf-8/' in n.lower() else 1,n))
            errors=[]
            for shp in cands:
              base=shp[:-4]; files={e:next((n for n in names if n.lower()==(base+e).lower()),None) for e in ['.shp','.shx','.dbf']}
              if not all(files.values()): continue
              for enc in (['utf-8','cp932'] if '/utf-8/' in shp.lower() else ['cp932','utf-8']):
                try:
                  r=shapefile.Reader(shp=io.BytesIO(z.read(files['.shp'])),shx=io.BytesIO(z.read(files['.shx'])),dbf=io.BytesIO(z.read(files['.dbf'])),encoding=enc,encodingErrors='strict')
                  if len(r): _=r.record(0)
                  return r,shp,enc
                except Exception as e: errors.append((shp,enc,repr(e)))
            raise SystemExit(f'cannot read {token}: {errors[:5]}')
          sr,sname,senc=shp_reader('Station'); rr,rname,renc=shp_reader('RailroadSection')
          sf=[f[0] for f in sr.fields[1:]]; rf=[f[0] for f in rr.fields[1:]]
          need={'N02_001','N02_002','N02_003','N02_004','N02_005'}
          if not need.issubset(sf): raise SystemExit(f'station schema {sf}')
          if not {'N02_003','N02_004'}.issubset(rf): raise SystemExit(f'rail schema {rf}')
          print('SOURCE',URL,'SHA',raw_sha,'STATION',sname,senc,len(sr),'RAIL',rname,renc,len(rr))

          station_records=defaultdict(list); rail_shapes=defaultdict(list)
          for idx,rec in enumerate(sr.iterShapeRecords()):
            d=dict(zip(sf,rec.record)); op=norm(d['N02_004']); line=norm(d['N02_003']); name=norm(d['N02_005'])
            if not op or not line or not name or not rec.shape.points: continue
            lat,lon=centroid(rec.shape); station_records[(op,line)].append({'name':name,'lat':lat,'lon':lon,'shape':rec.shape,'rail_type':str(d['N02_001']),'provider_type':str(d['N02_002']),'record_index':idx})
          for rec in rr.iterShapeRecords():
            d=dict(zip(rf,rec.record)); op=norm(d.get('N02_004')); line=norm(d.get('N02_003'))
            if op and line and rec.shape.points: rail_shapes[(op,line)].append(rec.shape)

          services={}; total_groups=0
          for service,recs in station_records.items():
            groups=[]
            for x in sorted(recs,key=lambda r:(r['name'],r['lat'],r['lon'],r['record_index'])):
              hit=None
              for g in groups:
                if g['name']==x['name'] and hav(g['lat'],g['lon'],x['lat'],x['lon'])<=300:
                  hit=g; break
              if hit is None:
                hit={'name':x['name'],'lat':x['lat'],'lon':x['lon'],'members':[],'nodes':set(),'rail_type':x['rail_type'],'provider_type':x['provider_type']}; groups.append(hit)
              hit['members'].append(x)
              n=len(hit['members']); hit['lat']=sum(m['lat'] for m in hit['members'])/n; hit['lon']=sum(m['lon'] for m in hit['members'])/n
            groups.sort(key=lambda g:(g['name'],g['lat'],g['lon']))
            for i,g in enumerate(groups): g['gid']=i
            services[service]=groups; total_groups+=len(groups)
          print('SERVICES',len(services),'STATION_GROUPS',total_groups,'RAIL_SERVICES',len(rail_shapes))

          gaps=[]; service_diag=[]; no_adj_total=0
          for service,groups in sorted(services.items()):
            op,line=service; adj=defaultdict(dict)
            def add_shape(sh):
              for pp in parts(sh):
                for a,b in zip(pp,pp[1:]):
                  na=node(a); nb=node(b)
                  if na==nb: continue
                  d=hav(na[1],na[0],nb[1],nb[0]); old=adj[na].get(nb)
                  if old is None or d<old: adj[na][nb]=d; adj[nb][na]=d
            for sh in rail_shapes.get(service,[]): add_shape(sh)
            for g in groups:
              for m in g['members']:
                add_shape(m['shape'])
                for pp in parts(m['shape']):
                  for p in pp: g['nodes'].add(node(p))
            graph_nodes=list(adj)
            for g in groups:
              good={n for n in g['nodes'] if n in adj}
              if not good and graph_nodes:
                best=min(graph_nodes,key=lambda n:hav(g['lat'],g['lon'],n[1],n[0])); bd=hav(g['lat'],g['lon'],best[1],best[0])
                if bd<=50: good={best}
              g['nodes']=good
            owner=defaultdict(set)
            for g in groups:
              for n in g['nodes']: owner[n].add(g['gid'])
            pairs={}; no_adj=0
            for g in groups:
              if not g['nodes']:
                no_adj+=1; continue
              dist={}; prev={}; heap=[]
              for n in g['nodes']: dist[n]=0.; prev[n]=None; heapq.heappush(heap,(0.,n))
              found={}
              while heap:
                d,u=heapq.heappop(heap)
                if d!=dist.get(u): continue
                others=[x for x in owner.get(u,()) if x!=g['gid']]
                if others:
                  for og in others:
                    if og not in found: found[og]=(d,u)
                  continue
                for v,w in adj.get(u,{}).items():
                  nd=d+w
                  if nd<dist.get(v,float('inf')):
                    dist[v]=nd; prev[v]=u; heapq.heappush(heap,(nd,v))
              if not found: no_adj+=1
              for og,(d,end) in found.items():
                a,b=sorted((g['gid'],og)); key=(a,b)
                if key in pairs and pairs[key]['gap_length_m']<=d: continue
                pairs[key]={'gap_length_m':d}
            no_adj_total+=no_adj
            for (a,b),v in pairs.items():
              ga,gb=groups[a],groups[b]
              gaps.append({'operator':op,'line':line,'station_a_id':f'2014_{len(gaps)}a_{a}','station_a':ga['name'],'station_b_id':f'2014_{len(gaps)}b_{b}','station_b':gb['name'],'gap_length_m':round(v['gap_length_m'],3),'endpoint_centroid_lat':(ga['lat']+gb['lat'])/2,'endpoint_centroid_lon':(ga['lon']+gb['lon'])/2,'railway_type_a':ga['rail_type'],'railway_type_b':gb['rail_type'],'service_provider_type_a':ga['provider_type'],'service_provider_type_b':gb['provider_type'],'official_brt_special_mode_excluded':line in SPECIAL})
            service_diag.append({'operator':op,'line':line,'station_groups':len(groups),'rail_shapes':len(rail_shapes.get(service,[])),'graph_nodes':len(adj),'adjacent_pairs':len(pairs),'stations_without_any_adjacent':no_adj})

          gaps.sort(key=lambda r:(r['operator'],r['line'],r['station_a'],r['station_b'],r['gap_length_m']))
          for i,r in enumerate(gaps): r['gap_id']=f'g14_{i:05d}'
          out=Path('out/transit_future_gap_universe_2014_strict.csv')
          fields=['gap_id','operator','line','station_a_id','station_a','station_b_id','station_b','gap_length_m','endpoint_centroid_lat','endpoint_centroid_lon','railway_type_a','railway_type_b','service_provider_type_a','service_provider_type_b','official_brt_special_mode_excluded']
          with out.open('w',encoding='utf-8',newline='') as f: w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(gaps)
          with open('out/service_topology_diagnostics.csv','w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=list(service_diag[0].keys())); w.writeheader(); w.writerows(service_diag)
          sanity=[r for r in gaps if {r['station_a'],r['station_b']}=={'新習志野','海浜幕張'}]
          meta={'cutoff':'2015-08-01','predictor_snapshot':'N02-2014','network_state_basis':'2014-12-31','source_url':URL,'source_sha256':raw_sha,'source_http_last_modified':'Thu, 16 Jul 2015 11:01:10 GMT','station_source':sname,'rail_source':rname,'services':len(services),'station_groups':total_groups,'gap_count':len(gaps),'stations_without_any_adjacent':no_adj_total,'special_route_gaps':sum(r['official_brt_special_mode_excluded'] for r in gaps),'sanity_new_narashino_kaihin_makuhari':len(sanity),'algorithm':'same-service graph: RailroadSection + Station vertices, snap 5 decimals; station-group nodes are barriers; Dijkstra first-hit other station defines adjacency'}
          Path('out/gap_universe_2014_summary.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          print('GATE',json.dumps(meta,ensure_ascii=False))
          print('GAP_SHA',hashlib.sha256(out.read_bytes()).hexdigest())
          print('SANITY',sanity[:5])
          if not (8000 <= len(gaps) <= 12000): raise SystemExit(f'implausible gap count {len(gaps)}')
          if len(sanity)<1: raise SystemExit('known 京葉線 gap missing')
          if no_adj_total>max(500,int(total_groups*.05)): raise SystemExit(f'too many stations without adjacency {no_adj_total}/{total_groups}')
          PY
          sha256sum out/*
      - name: Upload strict 2014 gap universe
        uses: actions/upload-artifact@v4
        with:
          name: transit-future-gap-universe-2014-strict
          path: out/
          if-no-files-found: error
          retention-days: 2
