name: Diagnostic Transit Future Fresh Older Holdout

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Evaluate preregistered 2014/2015-2020 holdout with 2010 population
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'requests==2.32.5' 'pyshp==2.3.1'
          mkdir -p input out
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/nekomario28/workers/actions/artifacts/9490350016/zip' -o /tmp/gaps.zip
          unzip -q /tmp/gaps.zip -d input
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/nekomario28/workers/a6104c9626100311c66063ff2789f641cb6051fe/diag/transit_future_fresh_holdout.py' \
            -o /tmp/evaluate.py
          printf '%s  %s\n' 'f275313b910685436c86fb094b3f03643d57f0df7834724341210a36d9438e78' /tmp/evaluate.py | sha256sum -c -
          python3 /tmp/evaluate.py
      - name: Upload fresh holdout evidence
        uses: actions/upload-artifact@v4
        with:
          name: transit-future-fresh-older-holdout
          path: out/
          if-no-files-found: error
          retention-days: 2
