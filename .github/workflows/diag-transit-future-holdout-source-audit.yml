name: Diagnostic Transit Future Older Holdout Source Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover exact e-Stat GIS API for 2010 Census 500m
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'requests==2.32.5'
          mkdir -p out
          python3 - <<'PY'
          import hashlib,re
          from pathlib import Path
          import requests
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.e-stat.go.jp/gis/statmap-search'})
          urls=[
            'https://www.e-stat.go.jp/modules/custom/gis_download/js/gis_download-main.js',
            'https://www.e-stat.go.jp/modules/custom/gis_download/js/gis_download-main.js?XXfqyzmEN9kP',
          ]
          text=''
          for i,u in enumerate(urls):
            r=s.get(u,timeout=60); print('JS',i,r.status_code,len(r.content),r.url); Path(f'out/gis_{i}.js').write_bytes(r.content)
            if r.status_code==200 and len(r.text)>len(text): text=r.text
          for i,line in enumerate(text.splitlines(),1):
            if any(k in line for k in ['search_detail','search-detail','statmap-search','gis/', 'aggregateUnit','toukeiYear','statsId','serveyId','surveyId','statisticsTable']):
              print('LINE',i,line[:4000])
          eps=sorted(set(re.findall(r'["\']([^"\']*(?:gis|statmap)[^"\']*)["\']',text,re.I)))
          Path('out/endpoints.txt').write_text('\n'.join(eps),encoding='utf-8')
          print('ENDPOINTS',len(eps))
          for x in eps: print('EP',x[:1000])
          PY
          sha256sum out/*
      - name: Upload endpoint audit
        uses: actions/upload-artifact@v4
        with:
          name: transit-future-estat-endpoint-audit
          path: out/
          if-no-files-found: error
          retention-days: 2
