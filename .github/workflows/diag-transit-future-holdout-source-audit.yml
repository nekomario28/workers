name: Diagnostic Transit Future Older Holdout Source Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact 2010 Census 500m transport and population field
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,hashlib,io,json,zipfile
          from pathlib import Path
          import urllib.request
          url='https://www.e-stat.go.jp/gis/statmap-search/data?statsId=T000609&code=5339&downloadType=2'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.e-stat.go.jp/gis/statmap-search'})
          with urllib.request.urlopen(req,timeout=60) as r:
            b=r.read(); final=r.geturl(); headers=dict(r.headers.items())
          print('URL',final,'BYTES',len(b),'SHA',hashlib.sha256(b).hexdigest(),'SIG',b[:8])
          print('HEADERS',json.dumps({k:headers.get(k) for k in ['Last-Modified','ETag','Content-Type','Content-Disposition']},ensure_ascii=False))
          if b[:2]!=b'PK': raise SystemExit('not zip')
          Path('out').mkdir(exist_ok=True); Path('out/T000609_5339.zip').write_bytes(b)
          z=zipfile.ZipFile(io.BytesIO(b)); print('ZIP_FILES',z.namelist())
          candidates=[n for n in z.namelist() if n.lower().endswith(('.txt','.csv'))]
          if len(candidates)!=1: raise SystemExit(f'unexpected data files {candidates}')
          raw=z.read(candidates[0]); Path('out/data.txt').write_bytes(raw)
          text=None; enc=None
          for e in ['cp932','utf-8-sig','utf-8']:
            try: text=raw.decode(e); enc=e; break
            except UnicodeDecodeError: pass
          if text is None: raise SystemExit('decode failed')
          rd=list(csv.reader(io.StringIO(text)))
          print('ENC',enc,'ROWS',len(rd),'HEADER0',rd[0] if rd else None,'HEADER1',rd[1] if len(rd)>1 else None)
          if len(rd)<3: raise SystemExit('too few rows')
          header=rd[0]
          if 'T000609001' not in header: raise SystemExit(f'T000609001 not in header {header}')
          idx=header.index('T000609001')
          print('TOTAL_POP_FIELD','T000609001','INDEX',idx)
          vals=[]
          for row in rd[2:12]:
            if len(row)>idx: vals.append((row[0],row[idx]))
          print('SAMPLE_TOTAL_POP',vals)
          Path('out/schema.json').write_text(json.dumps({'statsId':'T000609','serveyId':'H002005112010','aggregateUnit':'H','releaseDate':'2013-06-11','representative_first_mesh':'5339','zip_sha256':hashlib.sha256(b).hexdigest(),'inner_sha256':hashlib.sha256(raw).hexdigest(),'encoding':enc,'header':header,'total_population_field':'T000609001','rows':len(rd)-2},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          sha256sum out/*
      - name: Upload transport schema evidence
        uses: actions/upload-artifact@v4
        with:
          name: transit-future-2010-census-transport-schema
          path: out/
          if-no-files-found: error
          retention-days: 2
