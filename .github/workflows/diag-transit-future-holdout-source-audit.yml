name: Diagnostic Transit Future Older Holdout Source Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve exact statsId for 2010 Census 500m population table
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'requests==2.32.5' 'beautifulsoup4==4.13.4'
          mkdir -p out
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.e-stat.go.jp/gis/statmap-search'})
          u='https://www.e-stat.go.jp/gis/statmap-search/search_detail'
          cases=[
            {'type':'1','page':'1','toukeiCode':'00200521','toukeiYear':'2010','aggregateUnit':'H','serveyId':'H002005112010','all_count_flg':'1','show_child_item':'1','show_child2_item':'1'},
            {'type':'1','page':'1','toukeiCode':'00200521','toukeiYear':'2010','aggregateUnit':'H','serveyId':'H002005112010','facet_flg':'1','all_count_flg':'1','show_child_item':'1','show_child2_item':'1'},
          ]
          out=[]
          for ci,params in enumerate(cases):
            r=s.get(u,params=params,timeout=60); r.raise_for_status(); Path(f'out/case{ci}.json').write_bytes(r.content)
            j=r.json(); alltxt=json.dumps(j,ensure_ascii=False)
            stats=sorted(set(re.findall(r'T\d{6}',alltxt))); print('CASE',ci,'URL',r.url,'SHA',hashlib.sha256(r.content).hexdigest(),'STATS',stats)
            targets=[]
            for key in ['detail','detail_sub','detail_sub2','detail_sub3','facet','side_mega','filter_link']:
              if isinstance(j.get(key),str): targets.append((key,j[key]))
            tf=j.get('target_facet') or {}
            if isinstance(tf,dict):
              for key,val in tf.items():
                if isinstance(val,str): targets.append(('target_facet.'+key,val))
            for source,html in targets:
              soup=BeautifulSoup(html,'html.parser')
              for tag in soup.find_all(True):
                attrs={str(k):str(v) for k,v in tag.attrs.items() if str(k).startswith('data-') or str(k) in ('href','value','name')}
                txt=' '.join(tag.stripped_strings)
                blob=txt+' '+json.dumps(attrs,ensure_ascii=False)
                if any(x in blob for x in ['男女別人口総数','世帯総数','T000','H002005112010']):
                  rec={'case':ci,'source':source,'tag':tag.name,'text':txt[:1200],'attrs':attrs}
                  out.append(rec); print('REC',json.dumps(rec,ensure_ascii=False)[:6000])
          Path('out/records.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          # No future N02 snapshots are fetched in this source audit.
          PY
          sha256sum out/*
      - name: Upload statsId audit
        uses: actions/upload-artifact@v4
        with:
          name: transit-future-2010-census-statsid-audit
          path: out/
          if-no-files-found: error
          retention-days: 2
